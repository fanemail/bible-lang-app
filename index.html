<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>聖經多語言學習 — Phase 1 MVP（詩篇示範）</title>
<style>
  :root{
    --bg:#faf8f3;
    --bg-card:#ffffff;
    --text:#2a2622;
    --text-soft:#6b6357;
    --accent:#8a6d3b;
    --accent-soft:#e8dfc9;
    --border:#e4ddcd;
    --en-color:#2f5f8a;
    --ja-color:#8a4b1f;   /* 棕色，與中文黑字形成高對比 */
    --zh-color:#1c1a17;   /* 高對比近黑 */
    --font-scale:1;
    --line-scale:1.7;
    --nav-h:74px;
    --col-settings-bg:#e8dfc9;
    --col-chapter-bg:#f3ede0;
    --col-brand-bg:#8a6d3b;
    --col-brand-text:#fff8ec;
    --chunk-bg:#e9dfc0;
    --chunk-bg-hover:#dccf9e;
    --chunk-border:#c9b878;
    --chunk-text:#6b5518;
  }
  [data-theme="dark"]{
    --bg:#1c1a17;
    --bg-card:#26231f;
    --text:#ece7dd;
    --text-soft:#a89f8f;
    --accent:#d8b478;
    --accent-soft:#3a3327;
    --border:#3a352c;
    --en-color:#82b3e0;
    --ja-color:#d99a5b;   /* 深色模式下的棕色，保持高對比 */
    --zh-color:#f2ede2;
    --col-settings-bg:#332c22;
    --col-chapter-bg:#2c2822;
    --col-brand-bg:#5c4726;
    --col-brand-text:#f5e6c8;
    --chunk-bg:#4a3f22;
    --chunk-bg-hover:#5c4d2a;
    --chunk-border:#8a7538;
    --chunk-text:#e8d38a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Noto Sans TC","Hiragino Sans","PingFang TC",-apple-system,BlinkMacSystemFont,sans-serif;
    padding-top:var(--nav-h);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }

  /* ============ 固定置頂欄：單一列，三個功能區各自底色，每區兩行文字 ============ */
  header.topbar{
    position:fixed; top:0; left:0; right:0;
    height:var(--nav-h);
    display:flex;
    z-index:100;
    box-shadow:0 1px 4px rgba(0,0,0,.12);
  }
  header.topbar > button{
    flex:1;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:2px;
    border:none; cursor:pointer;
    font-family:inherit;
    padding:4px 6px;
  }
  .col-settings{
    background:var(--col-settings-bg);
    color:var(--accent);
    flex:0.85 !important;
  }
  .col-settings .row1{font-size:24px; line-height:1;}
  .col-settings .row2{font-size:15px; font-weight:700;}

  .col-chapter{
    background:var(--col-chapter-bg);
    color:var(--text);
    flex:1.3 !important;
    border-left:1px solid rgba(0,0,0,.06);
    border-right:1px solid rgba(0,0,0,.06);
  }
  .col-chapter .row1{font-size:12.5px; color:var(--text-soft); letter-spacing:.05em;}
  .col-chapter .row2{font-size:18px; font-weight:700;}

  .col-brand{
    background:var(--col-brand-bg);
    color:var(--col-brand-text);
    flex:1 !important;
    cursor:default;
  }
  .col-brand .row1{font-size:16px; font-weight:700; letter-spacing:.03em;}
  .col-brand .row2{font-size:13.5px; opacity:.9;}

  /* ============ 抽屜：書卷/章節導覽（點中間欄開啟） ============ */
  .drawer-backdrop, .panel-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,.35);
    z-index:150; opacity:0; pointer-events:none; transition:opacity .2s;
  }
  .drawer-backdrop.open, .panel-backdrop.open{opacity:1; pointer-events:auto;}
  .drawer{
    position:fixed; top:0; left:0; bottom:0;
    width:min(320px, 84vw);
    background:var(--bg-card);
    z-index:151;
    transform:translateX(-100%);
    transition:transform .25s ease;
    overflow-y:auto;
    padding:16px;
    border-right:1px solid var(--border);
  }
  .drawer.open{transform:translateX(0);}
  .drawer h3{margin:16px 0 8px; font-size:14px; color:var(--text-soft); font-weight:700;}
  .drawer h3:first-child{margin-top:0;}
  .booklist{display:flex; flex-wrap:wrap; gap:6px;}
  .booklist button{
    border:1px solid var(--border); background:var(--bg);
    color:var(--text); border-radius:8px; padding:10px 14px;
    font-size:17px; cursor:pointer;
  }
  .booklist button.current{background:var(--accent); color:#fff; border-color:var(--accent);}
  .booklist button:disabled{opacity:.35; cursor:default;}

  /* ============ 設置面板（點左側欄開啟，含閱讀/互動模式、缺省語言等） ============ */
  .panel{
    position:fixed; right:0; top:0; bottom:0;
    width:min(340px, 88vw);
    background:var(--bg-card);
    z-index:151;
    transform:translateX(100%);
    transition:transform .25s ease;
    overflow-y:auto;
    padding:18px;
    border-left:1px solid var(--border);
  }
  .panel.open{transform:translateX(0);}
  .panel h2{font-size:16px; margin:0 0 16px;}
  .panel-row{margin-bottom:18px;}
  .panel-row label{
    display:block; font-size:12px; color:var(--text-soft);
    margin-bottom:8px; font-weight:700;
  }
  .seg{display:flex; border:1px solid var(--border); border-radius:10px; overflow:hidden;}
  .seg button{
    flex:1; background:var(--bg); border:none; color:var(--text);
    padding:9px 4px; font-size:13px; cursor:pointer; border-right:1px solid var(--border);
  }
  .seg button:last-child{border-right:none;}
  .seg button.active{background:var(--accent); color:#fff;}
  .seg button:disabled{opacity:.4; cursor:default;}

  /* ============ 主內容 ============ */
  main{
    max-width:720px;
    margin:0 auto;
    padding:18px 14px 80px;
  }

  .verse{
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:14px 16px;
    margin-bottom:12px;
  }
  .verse-num{
    display:inline-block;
    font-size:calc(13px * var(--font-scale));
    color:var(--accent);
    font-weight:700;
    margin-right:6px;
  }
  .primary-text{
    font-size:calc(17px * var(--font-scale));
    line-height:var(--line-scale);
  }
  /* 主要語言文字段落依語言決定顏色 */
  .primary-text[data-lang="zh"]{color:var(--zh-color);}
  .primary-text[data-lang="en"]{color:var(--en-color);}
  .primary-text[data-lang="ja"]{color:var(--ja-color);}

  /* 行內小按鈕：緊接在該語言句末標點之後 */
  .inline-btn{
    display:inline-flex; align-items:center; justify-content:center;
    border:1px solid var(--border);
    background:var(--bg);
    color:var(--text-soft);
    font-size:calc(11px * var(--font-scale));
    padding:2px 7px;
    border-radius:20px;
    cursor:pointer;
    margin-left:4px;
    vertical-align:middle;
    line-height:1.6;
  }
  .inline-btn.speak{
    padding:2px 6px;
    font-size:calc(12px * var(--font-scale));
  }
  .inline-btn.badge.active{
    background:var(--accent); color:#fff; border-color:var(--accent);
    cursor:default; font-weight:700;
  }
  .inline-btn.badge.clickable{
    cursor:pointer;
  }
  .inline-btn.badge.clickable:hover{
    background:var(--accent-soft);
  }
  .inline-btn.badge.on{
    background:var(--accent-soft); color:var(--accent); border-color:var(--accent);
  }

  .verse-extra{
    margin-top:8px;
    padding-top:8px;
    border-top:1px dashed var(--border);
    display:none;
  }
  .verse-extra.show{display:block;}
  .verse-extra .lbl{
    font-size:calc(10.5px * var(--font-scale));
    letter-spacing:.05em;
    color:var(--text-soft);
    margin-bottom:2px;
    text-transform:uppercase;
  }
  .verse-extra .extra-text{
    font-size:calc(15.5px * var(--font-scale));
    line-height:var(--line-scale);
  }
  .verse-extra .extra-text[data-lang="zh"]{color:var(--zh-color);}
  .verse-extra .extra-text[data-lang="en"]{color:var(--en-color);}
  .verse-extra .extra-text[data-lang="ja"]{color:var(--ja-color);}

  /* ============ Phase 2：可點擊單詞 ============ */
  .word{
    cursor:pointer;
    border-bottom:1.5px dotted currentColor;
    opacity:.92;
  }
  .word:hover, .word:active{
    background:var(--accent-soft);
  }
  .word.saved{
    border-bottom-style:solid;
  }

  /* ============ 單詞卡（底部彈出） ============ */
  .sheet-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,.35);
    z-index:180; opacity:0; pointer-events:none; transition:opacity .2s;
  }
  .sheet-backdrop.open{opacity:1; pointer-events:auto;}
  .sheet{
    position:fixed; left:0; right:0; bottom:0;
    max-height:72vh;
    background:var(--bg-card);
    border-radius:18px 18px 0 0;
    z-index:181;
    transform:translateY(100%);
    transition:transform .25s ease;
    padding:16px 18px 24px;
    overflow-y:auto;
    box-shadow:0 -2px 12px rgba(0,0,0,.15);
  }
  .sheet.open{transform:translateY(0);}
  .sheet-handle{
    width:36px; height:4px; background:var(--border); border-radius:4px;
    margin:0 auto 14px;
  }
  .sheet-close{
    position:absolute; top:12px; right:14px;
    background:none; border:none; font-size:20px; color:var(--text-soft); cursor:pointer;
  }
  .word-row{
    display:flex; align-items:center; gap:10px;
    padding:10px 4px;
    border-bottom:1px solid var(--border);
    cursor:pointer;
  }
  .word-row:last-of-type{border-bottom:none;}
  .word-row .wr-main{flex:1; display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;}
  .word-row .wr-word{font-size:19px; font-weight:700;}
  .word-row .wr-word[data-lang="zh"]{color:var(--zh-color);}
  .word-row .wr-word[data-lang="en"]{color:var(--en-color);}
  .word-row .wr-word[data-lang="ja"]{color:var(--ja-color);}
  .word-row .wr-phon{font-size:13px; color:var(--text-soft);}
  .word-row .wr-freq{
    font-size:10.5px; color:var(--accent); background:var(--accent-soft);
    padding:2px 6px; border-radius:8px; font-weight:700;
  }
  .word-row .wr-play{
    border:1px solid var(--border); background:var(--bg); border-radius:50%;
    width:32px; height:32px; font-size:14px; cursor:pointer; flex-shrink:0;
  }
  .word-row.selected{background:var(--accent-soft);}
  .word-def{
    margin:10px 4px 4px; padding:12px 14px;
    background:var(--bg); border-radius:10px;
    font-size:14.5px; line-height:1.7; color:var(--text);
    display:none;
  }
  .word-def.show{display:block;}
  .sheet-star{
    display:flex; align-items:center; gap:6px;
    border:1px solid var(--border); background:var(--bg);
    color:var(--text-soft); border-radius:20px; padding:8px 14px;
    font-size:13px; cursor:pointer; margin-top:14px;
  }
  .sheet-star.on{
    background:var(--accent); color:#fff; border-color:var(--accent);
  }

  /* ============ 生詞本清單面板 ============ */
  .vocab-item{
    display:flex; align-items:center; gap:8px;
    padding:9px 4px; border-bottom:1px solid var(--border);
    font-size:14px;
  }
  .vocab-item .vi-lang{
    font-size:14px; font-weight:700; min-width:52px;
  }
  .vocab-item .vi-lang[data-lang="zh"]{color:var(--zh-color);}
  .vocab-item .vi-lang[data-lang="en"]{color:var(--en-color);}
  .vocab-item .vi-lang[data-lang="ja"]{color:var(--ja-color);}
  .vocab-item .vi-remove{
    margin-left:auto; background:none; border:none; color:var(--text-soft);
    font-size:16px; cursor:pointer; padding:4px 8px;
  }
  .vocab-empty{color:var(--text-soft); font-size:13px; padding:12px 4px;}

  /* ============ Phase 3：語義塊高亮 ============ */
  .chunk{
    background:var(--chunk-bg);
    border-radius:5px;
    padding:0 2px;
    cursor:pointer;
    box-shadow:0 0 0 1px var(--chunk-border) inset;
  }
  .chunk:hover{ background:var(--chunk-bg-hover); }
  .chunk-tag{
    display:inline-block;
    font-size:12px; font-weight:700; color:var(--chunk-text);
    background:var(--chunk-bg-hover);
    padding:2px 8px; border-radius:6px; margin-bottom:8px;
  }
  .chunk-phrase{
    font-size:17px; font-weight:700; margin-bottom:10px;
  }
  .chunk-gloss-lbl{ font-size:11px; color:var(--text-soft); margin-bottom:2px; text-transform:uppercase; letter-spacing:.05em; }
  .chunk-gloss{ font-size:16px; font-weight:700; color:var(--chunk-text); margin-bottom:14px; }
  .chunk-ref{ font-size:12.5px; color:var(--text-soft); }



  /* ============ 響應式斷點 ============ */
  @media (min-width:600px){
    main{padding:24px 20px 90px;}
    .verse{padding:16px 20px;}
  }
  @media (min-width:900px){
    main{max-width:760px;}
  }
  @media (max-height:420px) and (orientation:landscape){
    :root{--nav-h:52px;}
    .col-settings .row2, .col-chapter .row1, .col-brand .row2{display:none;}
    .verse{padding:10px 14px; margin-bottom:8px;}
  }
</style>
</head>
<body>

<header class="topbar">
  <button class="col-brand" disabled>
    <span class="row1">聖經</span>
    <span class="row2">語言神經內化</span>
  </button>
  <button class="col-chapter" id="chapterBtn" aria-label="開啟書卷目錄">
    <span class="row1" id="chapterRow1">篇章</span>
    <span class="row2" id="chapterRow2">詩篇 1章</span>
  </button>
  <button class="col-settings" id="settingsBtn" aria-label="開啟設置">
    <span class="row1">⚙</span>
    <span class="row2">設置</span>
  </button>
</header>

<div class="drawer-backdrop" id="drawerBackdrop"></div>
<div class="drawer" id="drawer">
  <h3>書卷（Phase 1 示範僅開放詩篇）</h3>
  <div class="booklist">
    <button class="current">詩篇 Psalms</button>
    <button disabled>箴言 Proverbs</button>
    <button disabled>約翰福音 John</button>
  </div>
  <h3>章</h3>
  <div class="booklist" id="chapterList"></div>
</div>

<div class="panel-backdrop" id="panelBackdrop"></div>
<div class="panel" id="panel">
  <h2>設置</h2>

  <div class="panel-row">
    <label>模式</label>
    <div class="seg">
      <button class="active" disabled>閱讀模式</button>
      <button disabled title="尚未開放">互動模式</button>
    </div>
  </div>

  <div class="panel-row">
    <label>缺省語言（決定標題／目錄／經文排序，缺省語言永遠排最前）</label>
    <div class="seg" id="defaultLangSeg">
      <button data-val="zh" class="active">中</button>
      <button data-val="en">EN</button>
      <button data-val="ja">日</button>
    </div>
  </div>

  <div class="panel-row">
    <label>字體大小</label>
    <div class="seg" id="fontSizeSeg">
      <button data-val="0.85">小</button>
      <button data-val="1" class="active">中</button>
      <button data-val="1.2">大</button>
      <button data-val="1.45">特大</button>
    </div>
  </div>

  <div class="panel-row">
    <label>行距</label>
    <div class="seg" id="lineHeightSeg">
      <button data-val="1.4">緊湊</button>
      <button data-val="1.7" class="active">標準</button>
      <button data-val="2.1">寬鬆</button>
    </div>
  </div>

  <div class="panel-row">
    <label>顯示模式</label>
    <div class="seg" id="themeSeg">
      <button data-val="light" class="active">日間</button>
      <button data-val="dark">夜間</button>
    </div>
  </div>

  <div class="panel-row">
    <label>朗讀語速（Web Speech，過渡方案）</label>
    <div class="seg" id="rateSeg">
      <button data-val="0.75">0.75x</button>
      <button data-val="1" class="active">1x</button>
      <button data-val="1.25">1.25x</button>
    </div>
  </div>

  <div class="panel-row">
    <label>單詞學習</label>
    <button class="sheet-star" id="vocabBtn" style="width:100%; justify-content:center; margin-top:0;">
      📖 生詞本（<span id="vocabCount">0</span>）
    </button>
  </div>
</div>

<div class="sheet-backdrop" id="wordSheetBackdrop"></div>
<div class="sheet" id="wordSheet">
  <div class="sheet-handle"></div>
  <button class="sheet-close" id="wordSheetClose" aria-label="關閉">✕</button>
  <div id="wordSheetBody"></div>
</div>

<div class="sheet-backdrop" id="vocabSheetBackdrop"></div>
<div class="sheet" id="vocabSheet">
  <div class="sheet-handle"></div>
  <button class="sheet-close" id="vocabSheetClose" aria-label="關閉">✕</button>
  <div class="panel-row" style="margin-bottom:8px;"><label style="margin-bottom:2px;">生詞本</label></div>
  <div id="vocabList"></div>
</div>

<div class="sheet-backdrop" id="chunkSheetBackdrop"></div>
<div class="sheet" id="chunkSheet">
  <div class="sheet-handle"></div>
  <button class="sheet-close" id="chunkSheetClose" aria-label="關閉">✕</button>
  <div id="chunkSheetBody"></div>
</div>

<main>
  <div id="verseList"></div>
</main>

<script>
/* ============ 示範資料：詩篇第一章三語逐節（公有領域文本） ============
   來源：英文 WEB＝ebible.org；中文 和合本繁體；日文 口語訳（Wikisource公有領域）
   正式版將改為讀取 /data/en/PSA.json 等分卷檔案，此處為Phase1 MVP內嵌示範。 */
const bibleData = {
  chapter: 1,
  bookNames: { zh:"詩篇", ja:"詩篇", en:"Psalms" },
  verses: [
    { n:1, zh:"不從惡人的計謀，不站罪人的道路，不坐褻慢人的座位，",
      en:"Blessed is the man who doesn't walk in the counsel of the wicked, nor stand on the path of sinners, nor sit in the seat of scoffers;",
      ja:"悪しき者のはかりごとに歩まず、罪びとの道に立たず、あざける者の座にすわらぬ人はさいわいである。" },
    { n:2, zh:"惟喜愛耶和華的律法，晝夜思想，這人便為有福！",
      en:"but his delight is in Yahweh's law. On his law he meditates day and night.",
      ja:"このような人は主のおきてをよろこび、昼も夜もそのおきてを思う。" },
    { n:3, zh:"他要像一棵樹栽在溪水旁，按時候結果子，葉子也不枯乾。凡他所做的盡都順利。",
      en:"He will be like a tree planted by the streams of water, that produces its fruit in its season, whose leaf also does not wither. Whatever he does shall prosper.",
      ja:"このような人は流れのほとりに植えられた木の時が来ると実を結び、その葉もしぼまないように、そのなすところは皆栄える。" },
    { n:4, zh:"惡人並不是這樣，乃像糠秕被風吹散。",
      en:"The wicked are not so, but are like the chaff which the wind drives away.",
      ja:"悪しき者はそうでない、風の吹き去るもみがらのようだ。" },
    { n:5, zh:"因此，當審判的時候惡人必站立不住；罪人在義人的會中也是如此。",
      en:"Therefore the wicked shall not stand in the judgment, nor sinners in the congregation of the righteous.",
      ja:"それゆえ、悪しき者はさばきに耐えない。罪びとは正しい者のつどいに立つことができない。" },
    { n:6, zh:"因為耶和華知道義人的道路；惡人的道路卻必滅亡。",
      en:"For Yahweh knows the way of the righteous, but the way of the wicked shall perish.",
      ja:"主は正しい者の道を知られる。しかし、悪しき者の道は滅びる。" }
  ]
};

/* ============ Phase 2 示範：詩篇第一章詞彙數據庫（小規模示範集） ============
   正式版將以英文WEB全卷約14,000詞為軸心，透過有道API批量建庫（見全景文檔6.3節）。
   此處僅示範詩篇1章的21個內容詞，用於驗證「原詞對原詞」兩層顯示與生詞本互動設計。
   freq為示範用粗略分級（非真實COCA數據），待COCA詞頻來源確認後替換。 */
const VOCAB = [

/* ============ Phase 3 示範：詩篇1:1、1:3 語義塊標注（已定案的IS/IC/VS/VC/AI()系統示範） ============
   目前示範僅涵蓋這兩節、且只做英文（日文JS/JC庫留待後續Phase），用於驗證高亮+彈卡UI設計。
   本示範中六庫比對尚未實際載入詞條清單，故暫時全部標為AI()，正式版會先跑Step2庫比對。 */
const CHUNKS = [
  { id:"CK01", text:"walk in the counsel of", tag:"AI()", gloss:"隨從主意", ref:"詩篇 1:1" },
  { id:"CK02", text:"stand on the path of", tag:"AI()", gloss:"同流合污", ref:"詩篇 1:1" },
  { id:"CK03", text:"sit in the seat of", tag:"AI()", gloss:"認同立場", ref:"詩篇 1:1" },
  { id:"CK04", text:"streams of water", tag:"AI()", gloss:"活水源頭", ref:"詩篇 1:3" },
  { id:"CK05", text:"does not wither", tag:"AI()", gloss:"歷久不衰", ref:"詩篇 1:3" },
  { id:"CK06", text:"produces its fruit in its season", tag:"AI()", gloss:"按時結果", ref:"詩篇 1:3" }
];
const CHUNKS_BY_ID = Object.fromEntries(CHUNKS.map(c=>[c.id, c]));

/* 在文字中標記語義塊：先做語塊層（可能跨詞），再做單詞層，兩者可巢狀共存 */
function highlightChunks(text, lang){
  if(lang !== 'en') return text; // 示範階段僅做英文；日文JS/JC庫、中文對應留待後續
  let result = text;
  const sorted = [...CHUNKS].sort((a,b)=> b.text.length - a.text.length);
  sorted.forEach(c=>{
    if(result.includes(c.text)){
      result = result.replace(c.text, `<span class="chunk" data-cid="${c.id}">${c.text}</span>`);
    }
  });
  return result;
}


/* 在文字中標記可點擊單詞：依語言掃描VOCAB，命中的字串包成 <span class="word"> */
function highlightText(text, lang){
  let result = text;
  const sorted = [...VOCAB].sort((a,b)=> b[lang].length - a[lang].length);
  sorted.forEach(v=>{
    const word = v[lang];
    if(!word) return;
    if(lang === 'en'){
      const re = new RegExp('\\b(' + word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')\\b', 'gi');
      result = result.replace(re, m => `<span class="word" data-id="${v.id}">${m}</span>`);
    } else {
      result = result.split(word).join(`<span class="word" data-id="${v.id}">${word}</span>`);
    }
  });
  return result;
}

const LANGS = {
  zh:{ label:"中", ttsLang:"zh-TW" },
  ja:{ label:"日", ttsLang:"ja-JP" },
  en:{ label:"EN", ttsLang:"en-US" }
};
const BADGE_ORDER = ["zh","ja","en"]; // 固定顯示順序：中、日、EN

let defaultLang = localStorage.getItem('bible_defaultLang') || 'zh';

/* ============ 渲染逐節（依缺省語言決定排序：缺省語言永遠排最前） ============ */
function renderVerses(){
  const verseList = document.getElementById('verseList');
  verseList.innerHTML = '';
  const others = BADGE_ORDER.filter(l => l !== defaultLang);

  bibleData.verses.forEach(v=>{
    const row = document.createElement('div');
    row.className = 'verse';

    // 主要語言（缺省語言）段落 + 緊接句末的行內按鈕（朗讀 + 中/日/EN 三個切換鍵）
    let badgesHtml = '';
    BADGE_ORDER.forEach(l=>{
      if(l === defaultLang){
        badgesHtml += `<button class="inline-btn badge active">${LANGS[l].label}</button>`;
      }else{
        badgesHtml += `<button class="inline-btn badge clickable" data-toggle="${l}">${LANGS[l].label}</button>`;
      }
    });

    row.innerHTML = `
      <span class="verse-num">${v.n}</span>
      <span class="primary-text" data-lang="${defaultLang}">${highlightText(highlightChunks(v[defaultLang], defaultLang), defaultLang)}<button class="inline-btn speak" data-speak-lang="${defaultLang}" aria-label="朗讀">🔊</button>${badgesHtml}</span>
      ${others.map(l => `
        <div class="verse-extra" data-lang-block="${l}">
          <div class="lbl">${l==='zh'?'和合本':(l==='en'?'World English Bible':'口語訳')}</div>
          <span class="extra-text" data-lang="${l}">${highlightText(highlightChunks(v[l], l), l)}<button class="inline-btn speak" data-speak-lang="${l}" aria-label="朗讀">🔊</button></span>
        </div>
      `).join('')}
    `;
    // 把每個verse暫存文字資料供朗讀按鈕查找
    row.dataset.verseIdx = bibleData.verses.indexOf(v);
    verseList.appendChild(row);
  });

  markSavedWords();

  // 更新頂欄中間欄「篇章顯示」
  const chapterLabelMap = { zh:'章', ja:'篇', en:'' };
  document.getElementById('chapterRow2').textContent =
    defaultLang === 'en'
      ? `${bibleData.bookNames.en} ${bibleData.chapter}`
      : `${bibleData.bookNames[defaultLang]} ${bibleData.chapter}${chapterLabelMap[defaultLang]}`;
}
renderVerses();

/* ============ 事件代理：語言切換 / 朗讀 ============ */
document.getElementById('verseList').addEventListener('click', e=>{
  const wordEl = e.target.closest('.word');
  if(wordEl){
    openWordSheet(wordEl.dataset.id);
    return;
  }
  const chunkEl = e.target.closest('.chunk');
  if(chunkEl){
    openChunkSheet(chunkEl.dataset.cid);
    return;
  }
  const toggleBtn = e.target.closest('button[data-toggle]');
  if(toggleBtn){
    const lang = toggleBtn.dataset.toggle;
    const row = toggleBtn.closest('.verse');
    const block = row.querySelector(`.verse-extra[data-lang-block="${lang}"]`);
    const showing = block.classList.toggle('show');
    toggleBtn.classList.toggle('on', showing);
    return;
  }
  const speakBtn = e.target.closest('button[data-speak-lang]');
  if(speakBtn){
    const row = speakBtn.closest('.verse');
    const idx = parseInt(row.dataset.verseIdx);
    const lang = speakBtn.dataset.speakLang;
    speak(bibleData.verses[idx][lang], LANGS[lang].ttsLang);
  }
});

/* ============ Web Speech API 朗讀（過渡方案，Phase5將替換為FCBH/LibriVox/WordProject真人音頻） ============ */
let currentRate = parseFloat(localStorage.getItem('bible_rate') || '1');
function speak(text, ttsLang){
  if(!('speechSynthesis' in window)){
    alert('此瀏覽器不支援語音朗讀，建議改用Chrome。');
    return;
  }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = ttsLang;
  u.rate = currentRate;
  window.speechSynthesis.speak(u);
}

function setupSeg(id, onChange){
  const seg = document.getElementById(id);
  if(!seg) return;
  seg.addEventListener('click', e=>{
    const btn = e.target.closest('button');
    if(!btn || btn.disabled) return;
    [...seg.children].forEach(c=>c.classList.remove('active'));
    btn.classList.add('active');
    onChange(btn.dataset.val);
  });
}

setupSeg('defaultLangSeg', val=>{
  defaultLang = val;
  localStorage.setItem('bible_defaultLang', val);
  renderVerses();
});
setupSeg('fontSizeSeg', val=>{
  document.documentElement.style.setProperty('--font-scale', val);
  localStorage.setItem('bible_fontScale', val);
});
setupSeg('lineHeightSeg', val=>{
  document.documentElement.style.setProperty('--line-scale', val);
  localStorage.setItem('bible_lineScale', val);
});
setupSeg('themeSeg', val=>{
  document.documentElement.setAttribute('data-theme', val==='dark' ? 'dark' : 'light');
  localStorage.setItem('bible_theme', val);
});
setupSeg('rateSeg', val=>{
  currentRate = parseFloat(val);
  localStorage.setItem('bible_rate', val);
});

/* 還原上次設置 */
function restoreSeg(id, storeKey, applyFn){
  const saved = localStorage.getItem(storeKey);
  if(saved){
    const seg = document.getElementById(id);
    [...seg.children].forEach(c=>{
      c.classList.toggle('active', c.dataset.val === saved);
    });
    if(applyFn) applyFn(saved);
  }
}
restoreSeg('defaultLangSeg','bible_defaultLang', v=>{ defaultLang=v; renderVerses(); });
restoreSeg('fontSizeSeg','bible_fontScale', v=>document.documentElement.style.setProperty('--font-scale', v));
restoreSeg('lineHeightSeg','bible_lineScale', v=>document.documentElement.style.setProperty('--line-scale', v));
restoreSeg('themeSeg','bible_theme', v=>document.documentElement.setAttribute('data-theme', v));
restoreSeg('rateSeg','bible_rate', v=>currentRate=parseFloat(v));

/* ============ Phase 2：單詞卡（兩層顯示：原詞+音標 → 點擊展開釋義） ============ */
const wordSheet = document.getElementById('wordSheet');
const wordSheetBackdrop = document.getElementById('wordSheetBackdrop');
const wordSheetBody = document.getElementById('wordSheetBody');
const LANG_ORDER = ['zh','ja','en']; // 與正文badge順序一致：中、日、EN
let currentWordId = null;
let expandedDefLang = null;

function openWordSheet(id){
  currentWordId = id;
  expandedDefLang = null;
  renderWordSheet();
  wordSheet.classList.add('open');
  wordSheetBackdrop.classList.add('open');
}
function closeWordSheet(){
  wordSheet.classList.remove('open');
  wordSheetBackdrop.classList.remove('open');
}
document.getElementById('wordSheetClose').addEventListener('click', closeWordSheet);
wordSheetBackdrop.addEventListener('click', closeWordSheet);

function renderWordSheet(){
  const v = VOCAB_BY_ID[currentWordId];
  if(!v) return;
  const saved = getVocabList().includes(v.id);
  const phon = { zh:v.zh_py, ja:v.ja_kana, en:v.en_ipa };
  const defs = { zh:v.zh_def, ja:v.ja_def, en:v.en_def };

  wordSheetBody.innerHTML = `
    ${LANG_ORDER.map(l => `
      <div class="word-row ${expandedDefLang===l?'selected':''}" data-def-lang="${l}">
        <button class="wr-play" data-play="${l}" aria-label="讀音">🔊</button>
        <div class="wr-main">
          <span class="wr-word" data-lang="${l}">${v[l]}</span>
          <span class="wr-phon">${phon[l]}</span>
          ${l==='en' ? `<span class="wr-freq">${v.freq}</span>` : ''}
        </div>
      </div>
    `).join('')}
    <div class="word-def ${expandedDefLang?'show':''}" id="wordDefBox">
      ${expandedDefLang ? `【${expandedDefLang==='zh'?'中文釋義':(expandedDefLang==='ja'?'日文釋義':'English definition')}】<br>${defs[expandedDefLang]}` : ''}
    </div>
    <button class="sheet-star ${saved?'on':''}" id="sheetStarBtn">
      ${saved ? '★ 已加入生詞本' : '☆ 加入生詞本'}
    </button>
  `;

  wordSheetBody.querySelectorAll('.word-row').forEach(row=>{
    row.addEventListener('click', e=>{
      if(e.target.closest('.wr-play')) return;
      const l = row.dataset.defLang;
      expandedDefLang = (expandedDefLang === l) ? null : l;
      renderWordSheet();
    });
  });
  wordSheetBody.querySelectorAll('[data-play]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      e.stopPropagation();
      playYoudao(v[btn.dataset.play], btn.dataset.play);
    });
  });
  document.getElementById('sheetStarBtn').addEventListener('click', ()=>{
    toggleVocab(v.id);
    renderWordSheet();
    markSavedWords();
    updateVocabCount();
  });
}

/* 有道讀音（點擊才聯網，文字/釋義本身完全本地） */
function playYoudao(word, lang){
  let url;
  if(lang==='en') url = `https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(word)}&type=2`;
  else if(lang==='ja') url = `https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(word)}&le=jap`;
  else url = `https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(word)}&le=zh`;
  new Audio(url).play().catch(()=>{ /* 離線或有道無法連線時靜默失敗，不干擾閱讀 */ });
}

/* ============ 生詞本（LocalStorage） ============ */
function getVocabList(){
  try{ return JSON.parse(localStorage.getItem('bible_vocabList') || '[]'); }
  catch(e){ return []; }
}
function toggleVocab(id){
  let list = getVocabList();
  if(list.includes(id)) list = list.filter(x=>x!==id);
  else list.push(id);
  localStorage.setItem('bible_vocabList', JSON.stringify(list));
}
function markSavedWords(){
  const list = getVocabList();
  document.querySelectorAll('.word').forEach(el=>{
    el.classList.toggle('saved', list.includes(el.dataset.id));
  });
}
function updateVocabCount(){
  document.getElementById('vocabCount').textContent = getVocabList().length;
}
updateVocabCount();

function renderVocabList(){
  const list = getVocabList();
  const box = document.getElementById('vocabList');
  if(list.length === 0){
    box.innerHTML = `<div class="vocab-empty">還沒有收藏任何單詞，點正文中的詞加入生詞本。</div>`;
    return;
  }
  box.innerHTML = list.map(id=>{
    const v = VOCAB_BY_ID[id];
    if(!v) return '';
    return `
      <div class="vocab-item" data-id="${v.id}">
        <span class="vi-lang" data-lang="zh">${v.zh}</span>
        <span class="vi-lang" data-lang="en">${v.en}</span>
        <span class="vi-lang" data-lang="ja">${v.ja}</span>
        <button class="vi-remove" data-remove="${v.id}" aria-label="移除">✕</button>
      </div>
    `;
  }).join('');
  box.querySelectorAll('.vocab-item').forEach(item=>{
    item.addEventListener('click', e=>{
      if(e.target.closest('.vi-remove')) return;
      vocabSheet.classList.remove('open'); vocabSheetBackdrop.classList.remove('open');
      openWordSheet(item.dataset.id);
    });
  });
  box.querySelectorAll('[data-remove]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      e.stopPropagation();
      toggleVocab(btn.dataset.remove);
      renderVocabList();
      markSavedWords();
      updateVocabCount();
    });
  });
}


/* ============ Phase 3：語義塊彈出卡片 ============ */
const chunkSheet = document.getElementById('chunkSheet');
const chunkSheetBackdrop = document.getElementById('chunkSheetBackdrop');
const chunkSheetBody = document.getElementById('chunkSheetBody');

function openChunkSheet(id){
  const c = CHUNKS_BY_ID[id];
  if(!c) return;
  chunkSheetBody.innerHTML = `
    <span class="chunk-tag">${c.tag}</span>
    <div class="chunk-phrase">${c.text}</div>
    <div class="chunk-gloss-lbl">附注 gloss</div>
    <div class="chunk-gloss">${c.gloss}</div>
    <div class="chunk-ref">出處：${c.ref}</div>
    <button class="sheet-star" id="chunkSpeakBtn" style="margin-top:14px;">🔊 朗讀語塊</button>
  `;
  document.getElementById('chunkSpeakBtn').addEventListener('click', ()=>{
    speak(c.text, 'en-US');
  });
  chunkSheet.classList.add('open');
  chunkSheetBackdrop.classList.add('open');
}
document.getElementById('chunkSheetClose').addEventListener('click', ()=>{
  chunkSheet.classList.remove('open'); chunkSheetBackdrop.classList.remove('open');
});
chunkSheetBackdrop.addEventListener('click', ()=>{
  chunkSheet.classList.remove('open'); chunkSheetBackdrop.classList.remove('open');
});

window.addEventListener('scroll', ()=>{
  localStorage.setItem('bible_scrollY', window.scrollY);
});
window.addEventListener('load', ()=>{
  const y = localStorage.getItem('bible_scrollY');
  if(y) window.scrollTo(0, parseInt(y));
});
</script>
</body>
</html>
