<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>聖經多語言學習 — Phase 1 MVP（詩篇示範）</title>
<style>
  :root{
    --bg:#faf8f3;
    --bg-card:#ffffff;
    --text:#2a2622;
    --text-soft:#6b6357;
    --accent:#8a6d3b;
    --accent-soft:#e8dfc9;
    --border:#e4ddcd;
    --en-color:#2f5f8a;
    --ja-color:#8a4b1f;   /* 棕色，與中文黑字形成高對比 */
    --zh-color:#1c1a17;   /* 高對比近黑 */
    --font-scale:1;
    --line-scale:1.7;
    --nav-h:74px;
    --col-settings-bg:#e8dfc9;
    --col-chapter-bg:#f3ede0;
    --col-brand-bg:#8a6d3b;
    --col-brand-text:#fff8ec;
    --chunk-bg:#e9dfc0;
    --chunk-bg-hover:#dccf9e;
    --chunk-border:#c9b878;
    --chunk-text:#6b5518;
    --quiz-bar-bg:#f2ead9;   /* 互動模式二級置頂欄底色：比bg-card深、比topbar的settings/chapter區塊淺，形成第三種色階 */
  }
  [data-theme="dark"]{
    --bg:#1c1a17;
    --bg-card:#26231f;
    --text:#ece7dd;
    --text-soft:#a89f8f;
    --accent:#d8b478;
    --accent-soft:#3a3327;
    --border:#3a352c;
    --en-color:#82b3e0;
    --ja-color:#d99a5b;   /* 深色模式下的棕色，保持高對比 */
    --zh-color:#f2ede2;
    --col-settings-bg:#332c22;
    --col-chapter-bg:#2c2822;
    --col-brand-bg:#5c4726;
    --col-brand-text:#f5e6c8;
    --chunk-bg:#4a3f22;
    --chunk-bg-hover:#5c4d2a;
    --chunk-border:#8a7538;
    --chunk-text:#e8d38a;
    --quiz-bar-bg:#332b1e;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Noto Sans TC","Hiragino Sans","PingFang TC",-apple-system,BlinkMacSystemFont,sans-serif;
    padding-top:var(--nav-h);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }

  /* ============ 固定置頂欄：單一列，三個功能區各自底色，每區兩行文字 ============ */
  header.topbar{
    position:fixed; top:0; left:0; right:0;
    min-height:var(--nav-h);
    display:flex;
    z-index:100;
    box-shadow:0 1px 4px rgba(0,0,0,.12);
  }
  header.topbar > button{
    flex:1;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:2px;
    border:none; cursor:pointer;
    font-family:inherit;
    padding:4px 6px;
  }
  .col-settings{
    background:var(--col-settings-bg);
    color:var(--accent);
    flex:0.85 !important;
  }
  .col-settings .row1{font-size:24px; line-height:1;}
  .col-settings .row2{font-size:15px; font-weight:700;}

  .col-chapter{
    background:var(--col-chapter-bg);
    color:var(--text);
    flex:1.5 !important;
    border-left:1px solid rgba(0,0,0,.06);
    border-right:1px solid rgba(0,0,0,.06);
  }
  .col-chapter .row1{font-size:15px; font-weight:700; color:var(--text-soft); letter-spacing:.05em;}
  .col-chapter .row2{font-size:15px; font-weight:700;}

  .col-brand{
    background:var(--col-brand-bg);
    color:var(--col-brand-text);
    flex:1 !important;
    cursor:default;
  }
  .col-brand .row1{font-size:18px; font-weight:700; letter-spacing:.03em;}
  .col-brand .row2{font-size:15px; opacity:.9;}
  .en-tag{font-size:1em; font-weight:400; opacity:.85;}

  .nav-arrows{
    display:flex; flex:0 0 auto;
  }
  .nav-arrow{
    width:30px; height:100%;
    border:none; background:transparent; color:var(--text);
    font-size:22px; line-height:1; cursor:pointer;
    font-family:inherit;
  }
  .nav-arrow:active{opacity:.5;}
  @media (max-width:599px){
    .nav-arrow{width:38px; font-size:24px;}
  }

  /* 通用：中英日/雙語並列樣式——手機直向堆疊，PC(≥600px)橫向連接顯示（用點分隔）。
     供頂欄篇章顯示、品牌/設置標題、抽屜「換書卷」按鈕等任何需要同時顯示多語言的地方共用。 */
  .i18n-inline{display:flex; flex-direction:column; align-items:center; gap:0;}
  .i18n-inline .lang-part{white-space:nowrap;}
  @media (min-width:600px){
    .i18n-inline{flex-direction:row; gap:6px;}
    .i18n-inline .lang-part:not(:last-child)::after{content:"·"; margin-left:6px; opacity:.4; font-weight:400;}
  }

  /* ============ 抽屜：書卷/章節導覽（點中間欄開啟） ============ */
  .drawer-backdrop, .panel-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,.35);
    z-index:150; opacity:0; pointer-events:none; transition:opacity .2s;
  }
  .drawer-backdrop.open, .panel-backdrop.open{opacity:1; pointer-events:auto;}
  .drawer{
    position:fixed; top:0; left:0; bottom:0;
    width:min(320px, 84vw);
    background:var(--bg-card);
    z-index:151;
    transform:translateX(-100%);
    transition:transform .25s ease;
    overflow-y:auto;
    padding:16px;
    border-right:1px solid var(--border);
  }
  .drawer.open{transform:translateX(0);}
  .drawer h3{margin:16px 0 8px; font-size:14px; color:var(--text-soft); font-weight:700;}
  .drawer h3:first-child{margin-top:0;}
  .booklist{display:flex; flex-wrap:wrap; gap:6px;}
  .booklist button{
    border:1px solid var(--border); background:var(--bg);
    color:var(--text); border-radius:8px; padding:10px 14px;
    font-size:17px; cursor:pointer;
  }
  .booklist button.current{background:var(--accent); color:#fff; border-color:var(--accent);}
  .booklist button:disabled{opacity:.35; cursor:default;}
  .drawer-back-btn{
    display:flex; align-items:center; gap:8px;
    margin-bottom:12px; padding:8px 12px;
    border:1px solid var(--border); background:var(--bg);
    color:var(--accent); border-radius:8px; font-size:15px; font-weight:700;
    cursor:pointer; font-family:inherit;
  }
  .drawer-back-arrow{font-size:18px; line-height:1;}

  /* ============ 設置面板（點左側欄開啟，含閱讀/互動模式、缺省語言等） ============ */
  .panel{
    position:fixed; right:0; top:0; bottom:0;
    width:min(340px, 88vw);
    background:var(--bg-card);
    z-index:151;
    transform:translateX(100%);
    transition:transform .25s ease;
    overflow-y:auto;
    padding:18px;
    border-left:1px solid var(--border);
  }
  .panel.open{transform:translateX(0);}
  .panel h2{font-size:16px; margin:0 0 16px;}
  .panel-row{margin-bottom:18px;}
  .panel-row label{
    display:block; font-size:12px; color:var(--text-soft);
    margin-bottom:8px; font-weight:700;
  }
  .seg{display:flex; border:1px solid var(--border); border-radius:10px; overflow:hidden;}
  .seg button{
    flex:1; background:var(--bg); border:none; color:var(--text);
    padding:9px 4px; font-size:13px; cursor:pointer; border-right:1px solid var(--border);
  }
  .seg button:last-child{border-right:none;}
  .seg button.active{background:var(--accent); color:#fff;}
  .seg button:disabled{opacity:.4; cursor:default;}

  /* appModeSeg現在有4個選項（閱讀/經文互譯/經文填空/語塊），面板較窄，
     改用2x2網格排列，比單列4等分更容易點擊、文字也不會被擠壓。 */
  #appModeSeg{
    display:grid; grid-template-columns:1fr 1fr;
    border:1px solid var(--border); border-radius:10px; overflow:hidden;
  }
  #appModeSeg button{
    flex:none; background:var(--bg); border:none; color:var(--text);
    padding:9px 4px; font-size:12.5px; cursor:pointer;
    border-right:1px solid var(--border); border-bottom:1px solid var(--border);
  }
  #appModeSeg button:nth-child(2n){ border-right:none; }
  #appModeSeg button:nth-child(3), #appModeSeg button:nth-child(4){ border-bottom:none; }
  #appModeSeg button.active{ background:var(--accent); color:#fff; }

  /* ============ 主內容 ============ */
  main{
    max-width:720px;
    margin:0 auto;
    padding:18px 14px 80px;
  }

  .verse{
    background:var(--bg-card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:14px 16px;
    margin-bottom:12px;
  }
  .verse-num{
    display:inline-block;
    font-size:calc(13px * var(--font-scale));
    color:var(--accent);
    font-weight:700;
    margin-right:6px;
  }
  .primary-text{
    font-size:calc(17px * var(--font-scale));
    line-height:var(--line-scale);
  }
  /* 主要語言文字段落依語言決定顏色 */
  .primary-text[data-lang="zh"]{color:var(--zh-color);}
  .primary-text[data-lang="en"]{color:var(--en-color);}
  .primary-text[data-lang="ja"]{color:var(--ja-color);}

  /* 行內小按鈕：緊接在該語言句末標點之後 */
  .inline-btn{
    display:inline-flex; align-items:center; justify-content:center;
    border:1px solid var(--border);
    background:var(--bg);
    color:var(--text-soft);
    font-size:calc(11px * var(--font-scale));
    padding:2px 7px;
    border-radius:20px;
    cursor:pointer;
    margin-left:4px;
    vertical-align:middle;
    line-height:1.6;
  }
  .inline-btn.speak{
    padding:2px 6px;
    font-size:calc(12px * var(--font-scale));
  }
  .inline-btn.badge.active{
    background:var(--accent); color:#fff; border-color:var(--accent);
    cursor:default; font-weight:700;
  }
  .inline-btn.badge.clickable{
    cursor:pointer;
  }
  .inline-btn.badge.clickable:hover{
    background:var(--accent-soft);
  }
  .inline-btn.badge.on{
    background:var(--accent-soft); color:var(--accent); border-color:var(--accent);
  }

  .verse-extra{
    margin-top:8px;
    padding-top:8px;
    border-top:1px dashed var(--border);
    display:none;
  }
  .verse-extra.show{display:block;}
  .verse-extra .lbl{
    font-size:calc(10.5px * var(--font-scale));
    letter-spacing:.05em;
    color:var(--text-soft);
    margin-bottom:2px;
    text-transform:uppercase;
  }
  .verse-extra .extra-text{
    font-size:calc(15.5px * var(--font-scale));
    line-height:var(--line-scale);
  }
  .verse-extra .extra-text[data-lang="zh"]{color:var(--zh-color);}
  .verse-extra .extra-text[data-lang="en"]{color:var(--en-color);}
  .verse-extra .extra-text[data-lang="ja"]{color:var(--ja-color);}

  /* ============ Phase 2：可點擊單詞 ============ */
  .word{
    cursor:pointer;
    border-bottom:1.5px dotted currentColor;
    opacity:.92;
  }
  .word:hover, .word:active{
    background:var(--accent-soft);
  }
  .word.saved{
    border-bottom-style:solid;
  }

  /* ============ 單詞卡（底部彈出） ============ */
  .sheet-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,.35);
    z-index:180; opacity:0; pointer-events:none; transition:opacity .2s;
  }
  .sheet-backdrop.open{opacity:1; pointer-events:auto;}
  .sheet{
    position:fixed; left:0; right:0; bottom:0;
    max-height:72vh;
    background:var(--bg-card);
    border-radius:18px 18px 0 0;
    z-index:181;
    transform:translateY(100%);
    transition:transform .25s ease;
    padding:16px 18px 24px;
    overflow-y:auto;
    box-shadow:0 -2px 12px rgba(0,0,0,.15);
  }
  .sheet.open{transform:translateY(0);}
  .sheet-handle{
    width:36px; height:4px; background:var(--border); border-radius:4px;
    margin:0 auto 14px;
  }
  .sheet-close{
    position:absolute; top:12px; right:14px;
    background:none; border:none; font-size:20px; color:var(--text-soft); cursor:pointer;
  }
  .word-row{
    display:flex; align-items:center; gap:10px;
    padding:10px 4px;
    border-bottom:1px solid var(--border);
    cursor:pointer;
  }
  .word-row:last-of-type{border-bottom:none;}
  .word-row .wr-main{flex:1; display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;}
  .word-row .wr-word{font-size:19px; font-weight:700;}
  .word-row .wr-word[data-lang="zh"]{color:var(--zh-color);}
  .word-row .wr-word[data-lang="en"]{color:var(--en-color);}
  .word-row .wr-word[data-lang="ja"]{color:var(--ja-color);}
  .word-row .wr-phon{font-size:13px; color:var(--text-soft);}
  .word-row .wr-freq{
    font-size:10.5px; color:var(--accent); background:var(--accent-soft);
    padding:2px 6px; border-radius:8px; font-weight:700;
  }
  .word-row .wr-play{
    border:1px solid var(--border); background:var(--bg); border-radius:50%;
    width:32px; height:32px; font-size:14px; cursor:pointer; flex-shrink:0;
  }
  .word-row.selected{background:var(--accent-soft);}
  .word-def{
    margin:10px 4px 4px; padding:12px 14px;
    background:var(--bg); border-radius:10px;
    font-size:14.5px; line-height:1.7; color:var(--text);
    display:none;
  }
  .word-def.show{display:block;}
  .sheet-star{
    display:flex; align-items:center; gap:6px;
    border:1px solid var(--border); background:var(--bg);
    color:var(--text-soft); border-radius:20px; padding:8px 14px;
    font-size:13px; cursor:pointer; margin-top:14px;
  }
  .sheet-star.on{
    background:var(--accent); color:#fff; border-color:var(--accent);
  }

  /* ============ 生詞本清單面板 ============ */
  .vocab-item{
    display:flex; align-items:center; gap:8px;
    padding:9px 4px; border-bottom:1px solid var(--border);
    font-size:14px;
  }
  .vocab-item .vi-lang{
    font-size:14px; font-weight:700; min-width:52px;
  }
  .vocab-item .vi-lang[data-lang="zh"]{color:var(--zh-color);}
  .vocab-item .vi-lang[data-lang="en"]{color:var(--en-color);}
  .vocab-item .vi-lang[data-lang="ja"]{color:var(--ja-color);}
  .vocab-item .vi-remove{
    margin-left:auto; background:none; border:none; color:var(--text-soft);
    font-size:16px; cursor:pointer; padding:4px 8px;
  }
  .vocab-empty{color:var(--text-soft); font-size:13px; padding:12px 4px;}

  /* ============ Phase 3：語義塊高亮 ============ */
  .chunk{
    background:var(--chunk-bg);
    border-radius:5px;
    padding:0 2px;
    cursor:pointer;
    box-shadow:0 0 0 1px var(--chunk-border) inset;
  }
  .chunk:hover{ background:var(--chunk-bg-hover); }
  .chunk.saved{ box-shadow:0 0 0 2px var(--chunk-text) inset; }
  .chunk-tag{
    display:inline-block;
    font-size:12px; font-weight:700; color:var(--chunk-text);
    background:var(--chunk-bg-hover);
    padding:2px 8px; border-radius:6px; margin-bottom:8px;
  }
  .chunk-phrase{
    font-size:17px; font-weight:700; margin-bottom:10px;
  }
  .chunk-gloss-lbl{ font-size:11px; color:var(--text-soft); margin-bottom:2px; text-transform:uppercase; letter-spacing:.05em; }
  .chunk-gloss{ font-size:16px; font-weight:700; color:var(--chunk-text); margin-bottom:14px; }
  .chunk-ref{ font-size:12.5px; color:var(--text-soft); }
  .chunk-verse-lbl{ font-size:12px; color:var(--text-soft); margin-top:14px; margin-bottom:4px; }
  .chunk-verse-box{
    background:var(--bg); border:1px solid var(--border); border-radius:10px;
    padding:10px 12px; font-size:15px; line-height:1.8;
  }

  /* 互動模式：語塊總覽（按書卷分組瀏覽） */
  .chunk-book-group{
    background:var(--bg-card); border:1px solid var(--border); border-radius:14px;
    margin-bottom:10px; overflow:hidden;
  }
  .chunk-book-header{
    width:100%; display:flex; align-items:center; justify-content:space-between;
    gap:8px; border:none; background:transparent; color:var(--text);
    font-size:15px; font-weight:700; padding:14px 16px; cursor:pointer; font-family:inherit;
  }
  .chunk-book-count{
    font-size:12px; font-weight:400; color:var(--text-soft); margin-right:auto; margin-left:8px;
  }
  .chunk-book-arrow{ font-size:12px; color:var(--text-soft); }
  .chunk-book-list{ border-top:1px solid var(--border); }
  .chunk-row{
    display:flex; align-items:baseline; justify-content:space-between; gap:10px;
    padding:11px 16px; border-left:4px solid var(--border); border-bottom:1px solid var(--border);
    cursor:pointer;
  }
  .chunk-row:last-child{ border-bottom:none; }
  .chunk-row:active{ background:var(--bg); }
  .chunk-row-text{ font-size:14.5px; line-height:1.5; }
  .chunk-row-ref{ font-size:12px; color:var(--text-soft); white-space:nowrap; flex:0 0 auto; }

  /* ============ Phase 4：學習追蹤與填空測驗 ============ */
  .progress-box{
    background:var(--bg); border-radius:10px; padding:12px 14px; margin-bottom:10px;
  }
  .progress-num{ font-size:22px; font-weight:700; color:var(--accent); }
  .progress-label{ font-size:12px; color:var(--text-soft); margin-top:2px; }
  .progress-bar-track{
    height:6px; background:var(--border); border-radius:3px; margin-top:10px; overflow:hidden;
  }
  .progress-bar-fill{
    height:100%; background:var(--accent); border-radius:3px; transition:width .3s;
  }
  .quiz-prompt-lbl{ font-size:12px; color:var(--text-soft); margin-bottom:6px; }
  .quiz-blank{
    font-size:19px; font-weight:700; margin-bottom:14px; line-height:1.6;
  }
  .quiz-input{
    width:100%; border:1px solid var(--border); border-radius:10px;
    padding:10px 12px; font-size:16px; background:var(--bg); color:var(--text);
    margin-bottom:10px;
  }
  .quiz-btn-row{ display:flex; gap:8px; margin-bottom:12px; }
  .quiz-btn-row button{
    flex:1; border:none; border-radius:10px; padding:10px; font-size:14px;
    font-weight:700; cursor:pointer;
  }
  .quiz-check-btn{ background:var(--accent); color:#fff; }
  .quiz-next-btn{ background:var(--bg); color:var(--text); border:1px solid var(--border) !important; }
  .quiz-feedback{
    border-radius:10px; padding:10px 14px; margin-bottom:12px; font-size:14px; font-weight:700;
    display:none;
  }
  .quiz-feedback.show{display:block;}
  .quiz-feedback.correct{ background:#dcefd8; color:#2f6b25; }
  .quiz-feedback.wrong{ background:#f5dede; color:#a3372e; }
  [data-theme="dark"] .quiz-feedback.correct{ background:#26382a; color:#8fd681; }
  [data-theme="dark"] .quiz-feedback.wrong{ background:#3a2726; color:#e79b93; }
  .quiz-reveal{
    background:var(--bg); border-radius:10px; padding:12px 14px;
    font-size:14px; line-height:1.8; color:var(--text); margin-bottom:12px;
    display:none;
  }
  .quiz-reveal.show{display:block;}
  .quiz-mark-btn{
    width:100%; border:1px solid var(--border); background:var(--bg); color:var(--text-soft);
    border-radius:20px; padding:9px; font-size:13px; cursor:pointer;
  }
  .quiz-mark-btn.on{ background:var(--accent); color:#fff; border-color:var(--accent); }

  /* 互動模式：三語經文配對測驗 */
  .quiz-answer-input{
    width:100%; border:1px solid var(--border); border-radius:10px;
    padding:10px 12px; font-size:15px; background:var(--bg); color:var(--text);
    font-family:inherit; resize:vertical; min-height:44px; box-sizing:border-box;
  }
  .quiz-reveal-box{ background:var(--bg); border-radius:10px; padding:10px 12px; }
  /* 互動模式二級置頂欄：貼在主頂欄下方，跟主頂欄用不同色階（--quiz-bar-bg）區分層級。
     手機（<600px）：2x2網格平均分佈，避免擠成一團；
     桌面（≥600px，跟全站既有斷點一致）：改成單列、justify-content:space-between平均分散。 */
  .quiz-topbar{
    position:sticky; top:var(--nav-h); z-index:5;
    display:grid; grid-template-columns:1fr 1fr; gap:10px;
    align-items:center;
    background:var(--quiz-bar-bg); border:1px solid var(--border); border-radius:14px;
    padding:10px 14px; margin-bottom:12px;
  }
  .quiz-topbar-title{
    justify-self:start;
    background:var(--accent-soft); color:var(--accent);
    font-weight:700; font-size:13px; white-space:nowrap;
    padding:6px 14px; border-radius:20px;
  }
  .quiz-lang-group{

<script>
/* ============ 響應式：動態量測頂欄實際高度 ============
   頂欄現在同時顯示中英日（或中英）多語文字，在窄螢幕上可能自動換行、
   高度因此隨螢幕寬度、字型載入、切換書卷（不同語言書名長度不同）而變動。
   若--nav-h寫死固定值，換行時內容會被裁切、或main內文被頂欄蓋住一截。
   改用ResizeObserver即時量測頂欄目前的實際高度、寫回CSS變數，
   讓main的padding-top（用同一個變數）永遠跟頂欄實際高度同步，
   不需要為PC/手機各自手動試數字，任何螢幕寬度都能自動適配。 */
(function(){
  const topbarEl = document.querySelector('header.topbar');
  function syncNavHeight(){
    document.documentElement.style.setProperty('--nav-h', topbarEl.offsetHeight + 'px');
  }
  if(window.ResizeObserver){
    new ResizeObserver(syncNavHeight).observe(topbarEl);
  }else{
    window.addEventListener('resize', syncNavHeight);
    window.addEventListener('load', syncNavHeight);
  }
  syncNavHeight();
})();

/* ============ 詩篇全卷資料（150章，來自 psalms_full_output.json） ============
   資料本體不內嵌於本檔案，改由 psalms_data.js（用 build_psalms_data.py 從
   psalms_full_output.json 轉出）透過 <script src="psalms_data.js"> 於本區塊之前載入，
   全域變數 PSALMS_DATA，格式：{ book:"psalms", chapters:{ "1":{verses:{"1":{en,zh,ja}, ...}}, ... } }
   bibleData 改為 let（非 const），因為切換章節時會重新賦值。
   來源：英文 WEB（ebible.org）／中文 和合本繁體（ebible.org）／日文 口語訳（jpn.bible，注音已去除）。 */
const PSALMS_DATA_SAFE = (typeof PSALMS_DATA !== 'undefined') ? PSALMS_DATA : { book:"psalms", chapters:{} };
if(Object.keys(PSALMS_DATA_SAFE.chapters).length === 0){
  console.warn('PSALMS_DATA 未載入或為空——請確認 psalms_data.js 是否放在 index.html 同一資料夾，且 <script src="psalms_data.js"> 有正確引入。');
}

/* ============ D6修復：11卷書卷登記表（故障點A） ============
   涵蓋chunks_data.js裡已標注語塊的11卷。章數為該書卷實際總章數（非僅已標注語塊的章數），
   例如創世記標了50章的選項，但B任務目前只做了1-11章的語塊，12章之後選了會有經文（若之後補上
   bible_text/GEN.json）但暫時不會有語塊高亮，這是預期行為，不是bug。
   BOOK_TEXT_SOURCES：D6經文本體已於本輪窗口補齊，11卷皆有對應資料源。每個非詩篇項目都用
   typeof判斷是否為undefined，若對應的{代碼}_data.js當初沒有轉出/沒有正確載入，會自動回傳null，
   由buildChapterVerses顯示「經文尚未接入」提示而不是報錯，這是刻意保留的防呆機制。 */
const BOOKS = {
  PSA:{ zh:"詩篇",     en:"Psalms",      ja:"詩篇",           chapters:150 },
  PRO:{ zh:"箴言",     en:"Proverbs",    ja:"箴言",           chapters:31  },
  ISA:{ zh:"以賽亞書", en:"Isaiah",      ja:"イザヤ書",       chapters:66  },
  ECC:{ zh:"傳道書",   en:"Ecclesiastes",ja:"伝道の書",       chapters:12  },
  GEN:{ zh:"創世記",   en:"Genesis",     ja:"創世記",         chapters:50  },
  MAT:{ zh:"馬太福音", en:"Matthew",     ja:"マタイによる福音書", chapters:28 },
  MRK:{ zh:"馬可福音", en:"Mark",        ja:"マルコによる福音書", chapters:16 },
  LUK:{ zh:"路加福音", en:"Luke",        ja:"ルカによる福音書",   chapters:24 },
  JHN:{ zh:"約翰福音", en:"John",        ja:"ヨハネによる福音書", chapters:21 },
  REV:{ zh:"啟示錄",   en:"Revelation",  ja:"ヨハネの黙示録",     chapters:22 },
  DAN:{ zh:"但以理書", en:"Daniel",      ja:"ダニエル書",         chapters:12 },
};
const BOOK_ORDER = ["PSA","PRO","ISA","ECC","GEN","MAT","MRK","LUK","JHN","REV","DAN"];

/* 頂欄「篇章」按鈕中間欄：同時顯示中英日三語書名+章節，PC橫向連接、手機直向堆疊（見CSS響應式斷點） */
function chapterDisplayHtml(bookCode, chapterNum){
  const b = BOOKS[bookCode];
  const chapterLabelMap = { zh:'章', ja:'篇', en:'' };
  return ['zh','en','ja'].map(l => {
    const label = l === 'en' ? `${b.en} ${chapterNum}` : `${b[l]}${chapterNum}${chapterLabelMap[l]}`;
    return `<span class="lang-part">${label}</span>`;
  }).join('');
}
const BOOK_TEXT_SOURCES = {
  PSA: PSALMS_DATA_SAFE,
  PRO: (typeof PRO_DATA !== 'undefined') ? PRO_DATA : null,
  ISA: (typeof ISA_DATA !== 'undefined') ? ISA_DATA : null,
  ECC: (typeof ECC_DATA !== 'undefined') ? ECC_DATA : null,
  GEN: (typeof GEN_DATA !== 'undefined') ? GEN_DATA : null,
  MAT: (typeof MAT_DATA !== 'undefined') ? MAT_DATA : null,
  MRK: (typeof MRK_DATA !== 'undefined') ? MRK_DATA : null,
  LUK: (typeof LUK_DATA !== 'undefined') ? LUK_DATA : null,
  JHN: (typeof JHN_DATA !== 'undefined') ? JHN_DATA : null,
  REV: (typeof REV_DATA !== 'undefined') ? REV_DATA : null,
  DAN: (typeof DAN_DATA !== 'undefined') ? DAN_DATA : null,
};

let currentBook = 'PSA';
let bibleData = { book:'PSA', chapter:1, bookNames: BOOKS.PSA, verses:[] };

/* 把某書卷某一章的 {節號:{en,zh,ja}} 物件轉成 renderVerses() 需要的陣列格式，並依節號排序。
   若該書卷尚無經文資料源（BOOK_TEXT_SOURCES裡沒有對應項或為null），回傳空陣列，
   renderVerses()會顯示「經文尚未接入」提示而不是空白一片，避免使用者誤以為是壞掉了。 */
function buildChapterVerses(bookCode, chapterNum){
  const source = BOOK_TEXT_SOURCES[bookCode];
  if(!source) return [];
  const chapterObj = source.chapters[String(chapterNum)];
  if(!chapterObj) return [];
  const vnums = Object.keys(chapterObj.verses).sort((a,b)=> parseInt(a)-parseInt(b));
  return vnums.map(vn => ({
    n: parseInt(vn),
    en: chapterObj.verses[vn].en || '',
    zh: chapterObj.verses[vn].zh || '',
    ja: chapterObj.verses[vn].ja || '',
  }));
}

/* ============ Phase 2 正式版：三語詞彙數據庫（7042條，來自 vocab_db.jsonl） ============
   資料本體不內嵌於本檔案，改由 vocab_data.js（用 build_vocab_data.py 從 vocab_db.jsonl 轉出）
   透過 <script src="vocab_data.js"> 於本區塊之前載入為全域變數 VOCAB_DATA，避免：
   (a) 本檔案肥大 (b) file:// 本機開啟時 fetch() 的 CORS 限制。
   欄位：id / en / en_ipa / zh / zh_py / zh_def / ja / ja_kana / ja_def / freq
   目前 zh_py / ja_kana / ja_def 尚為 null（有道API日文與拼音尚未補齊），
   renderWordSheet() 已對這些欄位做 null-safe 處理，不影響現有功能。
   注意：本詞庫不含 en_def（英文釋義），這點與早期示範格式不同，UI已對應調整。 */
const VOCAB = (typeof VOCAB_DATA !== 'undefined') ? VOCAB_DATA : [];
const VOCAB_BY_ID = Object.fromEntries(VOCAB.map(v=>[v.id, v]));
if(VOCAB.length === 0){
  console.warn('VOCAB_DATA 未載入或為空——請確認 vocab_data.js 是否放在 index.html 同一資料夾，且 <script src="vocab_data.js"> 有正確引入。');
}

/* ============ 資料品質防呆：偵測翻譯API額度超限等錯誤訊息誤存入詞典欄位 ============
   已知污染來源：MyMemory翻譯API免費額度超限時，會把警告句原封不動當成翻譯結果回傳，
   若建庫腳本沒有捕捉這種情況，警告句就會被寫進 en/zh/ja/zh_def/ja_def 欄位。
   這裡只做「顯示層防呆」，不會動 vocab_data.js 本身，資料本身仍需之後重新查詢修復。
   注意：此區塊必須放在 getVocabIndex/highlightText/renderVerses 呼叫之前，
   因為 renderVerses() 在腳本一開始就會執行，若 isBadData 定義在檔案後段會報錯。 */
const BAD_DATA_PATTERN = /mymemory|usagelimits|TRANSLATIONS FOR TODAY/i;
function isBadData(s){ return !!s && BAD_DATA_PATTERN.test(s); }
function safeField(s){ return isBadData(s) ? '⚠ 資料異常（API額度污染，待重新查詢）' : s; }

(function scanBadVocabOnLoad(){
  const fields = ['en','zh','ja','zh_def','ja_def'];
  const bad = VOCAB.filter(v => fields.some(f => isBadData(v[f])));
  if(bad.length){
    window.BAD_VOCAB_IDS = bad.map(v=>v.id);
    console.warn(`[詞典資料檢查] 發現 ${bad.length} / ${VOCAB.length} 條詞條含API錯誤訊息污染。`
      + `完整ID清單存於 window.BAD_VOCAB_IDS，可在Console輸入該變數查看。`);
  }
})();

/* ============ D6修復：語塊資料改為讀取 chunks_data.js 的 CHUNKS_DATA（11卷1164條） ============
   原本這裡是內嵌6條demo資料，跟chunks_data.js完全無關（故障點B）。
   現在改為：把CHUNKS_DATA（{ 書卷代碼: { en:[...], ja:[...] } }）展平成單一陣列，
   每條額外標記 book/lang，供highlightChunks()依「目前書卷+目前語言」篩選比對。
   CHUNKS_BY_ID仍保留全域查找（語塊本、測驗模式跨書卷收藏都需要用到）。 */
const CHUNKS_DATA_SAFE = (typeof CHUNKS_DATA !== 'undefined') ? CHUNKS_DATA : {};
if(Object.keys(CHUNKS_DATA_SAFE).length === 0){
  console.warn('CHUNKS_DATA 未載入或為空——請確認 chunks_data.js 是否放在 index.html 同一資料夾，且 <script src="chunks_data.js"> 有正確引入。');
}
const CHUNKS = [];
Object.keys(CHUNKS_DATA_SAFE).forEach(bookCode=>{
  ['en','ja'].forEach(lang=>{
    (CHUNKS_DATA_SAFE[bookCode][lang] || []).forEach(c=>{
      CHUNKS.push(Object.assign({}, c, { book: bookCode, lang: lang }));
    });
  });
});
const CHUNKS_BY_ID = Object.fromEntries(CHUNKS.map(c=>[c.id, c]));

/* ============ D1新增：語塊音頻查表（chunk_audio.js的CHUNK_AUDIO） ============
   格式：{ 語塊id: {book,chapter,verse,audioFile,startTime,endTime,matchedText} }
   只有跑過WhisperX對齊且成功配對的英文語塊才會出現在這裡（目前是詩篇457條）。
   查不到的語塊（包含全部日文語塊、還沒對齊的其他書卷）視為沒有真人語音可播放，
   語塊卡片會自動退回原本就有的TTS朗讀按鈕，不影響原有功能。 */
const CHUNK_AUDIO_SAFE = (typeof CHUNK_AUDIO !== 'undefined') ? CHUNK_AUDIO : {};
if(Object.keys(CHUNK_AUDIO_SAFE).length === 0){
  console.warn('CHUNK_AUDIO 未載入或為空——語塊播放將全部退回TTS朗讀。請確認 chunk_audio.js 是否放在 index.html 同一資料夾。');
}
/* 音頻檔案實際路徑：bible_data/audio/{語言}/{書卷代碼}/{audioFile}，跟A3下載腳本的目錄結構一致。
   D1日文擴展：改用info.lang判斷資料夾（en或ja），不再寫死en，
   chunk_audio.js/verse_audio.js的每筆資料現在都帶lang欄位可供判斷。 */
function chunkAudioPath(info){
  return `bible_data/audio/${info.lang}/${info.book}/${info.audioFile}`;
}

/* ============ D1新增：整節真人語音查表（verse_audio.js的VERSE_AUDIO） ============
   不需要文字比對，直接來自WhisperX對齊結果裡每節本來就有的startTime/endTime。
   ★D1日文擴展：key格式從「書卷-章-節」改成「書卷-語言-章-節」，因為現在中英日
   可能都有各自的整節時間戳，同一個書卷+章+節但不同語言，起訖時間也不同，
   不加語言區分會互相覆蓋。呼叫端需要多傳一個lang參數。 */
const VERSE_AUDIO_SAFE = (typeof VERSE_AUDIO !== 'undefined') ? VERSE_AUDIO : {};
if(Object.keys(VERSE_AUDIO_SAFE).length === 0){
  console.warn('VERSE_AUDIO 未載入或為空——整節播放將全部退回TTS朗讀。請確認 verse_audio.js 是否放在 index.html 同一資料夾。');
}
function getVerseAudioInfo(bookCode, lang, chapter, verseNum){
  return VERSE_AUDIO_SAFE[`${bookCode}-${lang}-${chapter}-${verseNum}`] || null;
}

/* 在文字中標記語義塊：先做語塊層（可能跨詞），再做單詞層，兩者可巢狀共存。
   D6修復：移除原本「if(lang !== 'en') return text;」的寫死跳過（故障點C），
   改為依 bookCode+lang 篩選出該卷該語言的語塊清單再比對。
   中文目前語塊庫（IS/IC/JS）皆未含zh欄位，故中文永遠無語塊可比對，函式本身已能正確處理（filter結果為空陣列）。 */
function highlightChunks(text, lang, bookCode){
  const pool = CHUNKS.filter(c => c.book === bookCode && c.lang === lang);
  if(!pool.length) return text;
  let result = text;
  const sorted = [...pool].sort((a,b)=> b.text.length - a.text.length);
  sorted.forEach(c=>{
    if(result.includes(c.text)){
      result = result.replace(c.text, `<span class="chunk" data-cid="${c.id}">${c.text}</span>`);
    }
  });
  return result;
}


/* 各語言的比對索引（一次性建立、快取重複使用）。
   7042詞規模下，若每節文字都重新遍歷整個VOCAB陣列會明顯變慢，
   改為預先把該語言所有詞條組成一個大型交替regex，一次replace掃過全文。
   長字串優先比對（sort by length desc），避免短詞先吃掉長詞的一部分。 */
const VOCAB_INDEX = {};
function getVocabIndex(lang){
  if(VOCAB_INDEX[lang]) return VOCAB_INDEX[lang];
  const entries = VOCAB.filter(v => v[lang] && !isBadData(v[lang])).sort((a,b)=> b[lang].length - a[lang].length);
  const map = new Map();
  const escaped = [];
  entries.forEach(v=>{
    const key = lang === 'en' ? v[lang].toLowerCase() : v[lang];
    if(!map.has(key)){
      map.set(key, v.id);
      escaped.push(v[lang].replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
    }
  });
  if(!escaped.length){
    VOCAB_INDEX[lang] = { map, pattern:null };
    return VOCAB_INDEX[lang];
  }
  const wordPart = lang === 'en'
    ? ('\\b(?:' + escaped.join('|') + ')\\b')
    : ('(?:' + escaped.join('|') + ')');
  /* 關鍵修正：正則第一個分支專門「吃掉」完整的HTML標籤（<...>），原樣放行不比對，
     避免字典詞（例如"span"這種常見英文單字）剛好比對命中highlightChunks已插入的
     </span>標籤內部文字，把HTML結構劈壞。第二分支才是真正的字典詞比對。 */
  const pattern = new RegExp('(<[^>]+>)|(' + wordPart + ')', lang === 'en' ? 'gi' : 'g');
  VOCAB_INDEX[lang] = { map, pattern };
  return VOCAB_INDEX[lang];
}

/* 在文字中標記可點擊單詞：命中的字串包成 <span class="word">；HTML標籤本身原樣跳過 */
function highlightText(text, lang){
  const idx = getVocabIndex(lang);
  if(!idx.pattern) return text;
  return text.replace(idx.pattern, (m, tag)=>{
    if(tag) return tag; // 命中的是HTML標籤本身，不比對字典，原樣保留
    const key = lang === 'en' ? m.toLowerCase() : m;
    const id = idx.map.get(key);
    return id ? `<span class="word" data-id="${id}">${m}</span>` : m;
  });
}

const LANGS = {
  zh:{ label:"中", ttsLang:"zh-TW" },
  ja:{ label:"日", ttsLang:"ja-JP" },
  en:{ label:"EN", ttsLang:"en-US" }
};
const BADGE_ORDER = ["zh","ja","en"]; // 固定顯示順序：中、日、EN

/* ============ 渲染逐節（依缺省語言決定排序：缺省語言永遠排最前） ============ */
function renderVerses(){
  const verseList = document.getElementById('verseList');
  verseList.innerHTML = '';
  const others = BADGE_ORDER.filter(l => l !== defaultLang);

  if(bibleData.verses.length === 0){
    verseList.innerHTML = `
      <div class="verse" style="text-align:center; color:var(--text-soft);">
        本卷（${bibleData.bookNames.zh}）第${bibleData.chapter}章尚未接入經文資料庫<br>
        <span style="font-size:13px;">語塊庫已就緒，等 bible_text/${bibleData.book}.json 上傳並載入後會自動顯示</span>
      </div>
    `;
    document.getElementById('chapterRow2').innerHTML = chapterDisplayHtml(bibleData.book, bibleData.chapter);
    return;
  }

  bibleData.verses.forEach(v=>{
    const row = document.createElement('div');
    row.className = 'verse';

    // 主要語言（缺省語言）段落 + 緊接句末的行內按鈕（朗讀 + 中/日/EN 三個切換鍵）
    let badgesHtml = '';
    BADGE_ORDER.forEach(l=>{
      if(l === defaultLang){
        badgesHtml += `<button class="inline-btn badge active">${LANGS[l].label}</button>`;
      }else{
        badgesHtml += `<button class="inline-btn badge clickable" data-toggle="${l}">${LANGS[l].label}</button>`;
      }
    });

    // D1新增：每節每個語言各自判斷有沒有真人語音，有的話喇叭圖示改成🎧，
    // 讓使用者不用點下去試才知道是真人語音還是TTS機器合成。
    // ★D1日文擴展：改成呼叫getVerseAudioInfo時多傳目前語言，不再寫死只認英文，
    // 日文若有VERSE_AUDIO資料也會自動顯示🎧，沒有資料的語言（如中文）自動維持🔊。
    const primaryHasAudio = getVerseAudioInfo(bibleData.book, defaultLang, bibleData.chapter, v.n);
    const primaryIcon = primaryHasAudio ? '🎧' : '🔊';

    row.innerHTML = `
      <span class="verse-num">${v.n}</span>
      <span class="primary-text" data-lang="${defaultLang}">${highlightText(highlightChunks(v[defaultLang], defaultLang, bibleData.book), defaultLang)}<button class="inline-btn speak" data-speak-lang="${defaultLang}" aria-label="朗讀">${primaryIcon}</button>${badgesHtml}</span>
      ${others.map(l => {
        const hasAudio = getVerseAudioInfo(bibleData.book, l, bibleData.chapter, v.n);
        const icon = hasAudio ? '🎧' : '🔊';
        return `
        <div class="verse-extra" data-lang-block="${l}">
          <div class="lbl">${l==='zh'?'和合本':(l==='en'?'World English Bible':'口語訳')}</div>
          <span class="extra-text" data-lang="${l}">${highlightText(highlightChunks(v[l], l, bibleData.book), l)}<button class="inline-btn speak" data-speak-lang="${l}" aria-label="朗讀">${icon}</button></span>
        </div>
      `;
      }).join('')}
    `;
    // 把每個verse暫存文字資料供朗讀按鈕查找
    row.dataset.verseIdx = bibleData.verses.indexOf(v);
    verseList.appendChild(row);
  });

  markSavedWords();
  markSavedChunks();

  // 更新頂欄中間欄「篇章顯示」：中英日同時顯示
  document.getElementById('chapterRow2').innerHTML = chapterDisplayHtml(bibleData.book, bibleData.chapter);
}

/* ============ 事件代理：語言切換 / 朗讀 ============ */
document.getElementById('verseList').addEventListener('click', e=>{
  const wordEl = e.target.closest('.word');
  if(wordEl){
    openWordSheet(wordEl.dataset.id);
    return;
  }
  const chunkEl = e.target.closest('.chunk');
  if(chunkEl){
    openChunkSheet(chunkEl.dataset.cid);
    return;
  }
  const toggleBtn = e.target.closest('button[data-toggle]');
  if(toggleBtn){
    const lang = toggleBtn.dataset.toggle;
    const row = toggleBtn.closest('.verse');
    const block = row.querySelector(`.verse-extra[data-lang-block="${lang}"]`);
    const showing = block.classList.toggle('show');
    toggleBtn.classList.toggle('on', showing);
    return;
  }
  const speakBtn = e.target.closest('button[data-speak-lang]');
  if(speakBtn){
    const row = speakBtn.closest('.verse');
    const idx = parseInt(row.dataset.verseIdx);
    const lang = speakBtn.dataset.speakLang;
    const v = bibleData.verses[idx];
    // D1新增：有真人語音資料時播放真人語音；沒有的語言（或還沒對齊的書卷）維持原本TTS
    const audioInfo = getVerseAudioInfo(bibleData.book, lang, bibleData.chapter, v.n);
    if(audioInfo){
      playVerseRealAudio(audioInfo, speakBtn);
    }else{
      speak(v[lang], LANGS[lang].ttsLang);
    }
  }
});

/* ============ Web Speech API 朗讀（過渡方案，Phase5將替換為FCBH/LibriVox/WordProject真人音頻） ============ */
let currentRate = parseFloat(localStorage.getItem('bible_rate') || '1');
function speak(text, ttsLang){
  if(!('speechSynthesis' in window)){
    alert('此瀏覽器不支援語音朗讀，建議改用Chrome。');
    return;
  }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = ttsLang;
  u.rate = currentRate;
  window.speechSynthesis.speak(u);
}

const drawerBackdrop = document.getElementById('drawerBackdrop');

/* 抽屜採兩段式：先選書卷，選定後立即切到章節格，不再同時顯示其他書卷清單（節省畫面）。
   已經選過書卷的情況下（一般使用中大多數時候），直接開抽屜就顯示目前書卷的章節格，
   需要換書卷時再點「‹ 換書卷」回到書卷清單。 */
function showDrawerBookView(){
  drawerChapterView.style.display = 'none';
  drawerBookView.style.display = '';
  renderBookList();
}
function showDrawerChapterView(bookCode){
  drawerBookView.style.display = 'none';
  drawerChapterView.style.display = '';
  drawerChapterBookName.textContent = `${BOOKS[bookCode].zh} ${BOOKS[bookCode].en} ${BOOKS[bookCode].ja}`;
}
document.getElementById('chapterBtn').addEventListener('click', ()=>{
  buildChapterGrid(currentBook);
  showDrawerChapterView(currentBook);
  drawer.classList.add('open'); drawerBackdrop.classList.add('open');
});

drawerBackdrop.addEventListener('click', ()=>{
  drawer.classList.remove('open'); drawerBackdrop.classList.remove('open');
});
const chapterList = document.getElementById('chapterList');
const bookList = document.getElementById('bookList');

/* 建立章節數字格（依書卷實際章數），並標記目前正在閱讀的章節（如果剛好是同一本書） */
function buildChapterGrid(bookCode){
  const total = BOOKS[bookCode].chapters;
  chapterList.innerHTML = '';
  for(let i=1;i<=total;i++){
    const b = document.createElement('button');
    b.textContent = i;
    b.dataset.chapter = i;
    if(bibleData && bibleData.book === bookCode && bibleData.chapter === i) b.classList.add('current');
    chapterList.appendChild(b);
  }
}

/* 渲染書卷清單（11卷，取代原本硬寫死的3個按鈕） */
function renderBookList(){
  bookList.innerHTML = BOOK_ORDER.map(code => `
    <button data-book="${code}" class="${code===currentBook?'current':''}">${BOOKS[code].zh} ${BOOKS[code].en} ${BOOKS[code].ja}</button>
  `).join('');
}
bookList.addEventListener('click', e=>{
  const btn = e.target.closest('button[data-book]');
  if(!btn) return;
  switchBook(btn.dataset.book);
});

/* 使用者從書卷清單主動點選書卷：只建立章節格、切到章節視圖，
   ★不自動載入任何章節、不關閉抽屜——讓使用者自己從章節格裡點選要看哪一章。
   （修正前的問題：這裡曾經接著呼叫loadChapter，導致畫面上的章節格幾乎瞬間就被自動選了
   第1章並關閉抽屜，使用者完全來不及看到、來不及自己選。） */
function switchBook(bookCode){
  currentBook = bookCode;
  localStorage.setItem('bible_currentBook', bookCode);
  buildChapterGrid(bookCode);
  showDrawerChapterView(bookCode);
}

/* 載入指定書卷+章節：更新bibleData、重新渲染、更新目錄按鈕的current標記、記住上次章節、關閉抽屜。
   ★History API整合（返回/前進箭頭用）：預設會pushState記錄這次導覽，
   若是被popstate（使用者按瀏覽器/畫面上的返回或前進）或初始載入觸發的呼叫，
   則傳skipHistory=true避免重複記錄。 */
function loadChapter(bookCode, chapterNum, skipHistory){
  currentBook = bookCode;
  bibleData = {
    book: bookCode,
    chapter: chapterNum,
    bookNames: BOOKS[bookCode],
    verses: buildChapterVerses(bookCode, chapterNum),
  };
  renderVerses();
  [...chapterList.children].forEach(btn=>{
    btn.classList.toggle('current', parseInt(btn.dataset.chapter) === chapterNum);
  });
  localStorage.setItem('bible_chapter_' + bookCode, String(chapterNum));
  drawer.classList.remove('open'); drawerBackdrop.classList.remove('open');
  if(!skipHistory){
    history.pushState({book:bookCode, chapter:chapterNum}, '', '');
  }
}

chapterList.addEventListener('click', e=>{
  const btn = e.target.closest('button[data-chapter]');
  if(!btn) return;
  loadChapter(currentBook, parseInt(btn.dataset.chapter));
});

/* ============ 返回/前進箭頭：標準瀏覽器History API，跟瀏覽器自己的上一頁/下一頁完全同步 ============ */
document.getElementById('navBackBtn').addEventListener('click', ()=> history.back());
document.getElementById('navForwardBtn').addEventListener('click', ()=> history.forward());
window.addEventListener('popstate', e=>{
  if(e.state && e.state.book && BOOKS[e.state.book]){
    if(e.state.book !== currentBook){
      buildChapterGrid(e.state.book);
    }
    loadChapter(e.state.book, e.state.chapter, true);
  }
});

/* 初始載入：還原上次瀏覽的書卷+章節，沒有記錄則預設詩篇第1章。
   跟switchBook不同，這裡要直接載入內容（沒有「使用者主動點選」這個前提，
   一開始總要顯示點什麼），所以直接建格子+載入章節，不經過switchBook。 */
const savedBook = localStorage.getItem('bible_currentBook');
const initialBook = (savedBook && BOOKS[savedBook]) ? savedBook : 'PSA';
const savedChapterInit = parseInt(localStorage.getItem('bible_chapter_' + initialBook) || '1');
const initialChapter = (savedChapterInit >= 1 && savedChapterInit <= BOOKS[initialBook].chapters) ? savedChapterInit : 1;
currentBook = initialBook;
buildChapterGrid(initialBook);
loadChapter(initialBook, initialChapter, true);
history.replaceState({book:currentBook, chapter:bibleData.chapter}, '', '');

/* ============ 設置面板文字三語化 ============
   面板標題（"設置 Settings 設定"）永遠三語同時顯示、不受此設定影響（見HTML），
   目的是讓不管目前介面是哪個語言的使用者，都認得出這是設置入口。
   面板「其餘」文字（各項標籤、按鈕）則依"缺省語言"的選擇整個切換顯示語言，

  });

/* ============ D1新增：語塊真人語音播放 ============
   邏輯：跳到查表算好的startTime開始播放，用timeupdate事件監控，
   播到endTime就自動暫停，不會把下一段音頻也播出來。
   同一個<audio>元素全站共用（語塊播放、整節播放都用這一個），切換播放目標時
   只需要重設src（不同章節音頻檔案不同時才需要）跟起訖時間，也確保同時間只會有一段在播放。 */
const chunkAudioPlayer = document.getElementById('chunkAudioPlayer');
let realAudioStopHandler = null;

function stopRealAudio(){
  if(realAudioStopHandler){
    chunkAudioPlayer.removeEventListener('timeupdate', realAudioStopHandler);
    realAudioStopHandler = null;
  }
  chunkAudioPlayer.pause();
}

/* 通用播放函式：path是音頻檔案路徑，start/end是這一段的起訖秒數，onDone在播放結束（含被手動打斷）時呼叫，
   用來讓呼叫端重置自己的按鈕文字/圖示。語塊播放、整節播放都呼叫這個函式，只是path/start/end/onDone不同。 */
function playRealAudioSegment(path, start, end, onDone){
  stopRealAudio();
  const playFrom = ()=>{
    chunkAudioPlayer.currentTime = start;
    chunkAudioPlayer.play().catch(()=>{
      alert('音頻播放失敗，請確認 ' + path + ' 這個檔案存在於index.html同資料夾底下的對應路徑。');
      if(onDone) onDone();
    });
    realAudioStopHandler = ()=>{
      if(chunkAudioPlayer.currentTime >= end){
        stopRealAudio();
        if(onDone) onDone();
      }
    };
    chunkAudioPlayer.addEventListener('timeupdate', realAudioStopHandler);
  };
  // 不同語塊/節可能屬於不同章節（不同音頻檔案），只有在檔案真的不同時才重新載入，避免每次都重新讀取同一個大檔案
  const needsReload = !chunkAudioPlayer.dataset.path || chunkAudioPlayer.dataset.path !== path;
  if(needsReload){
    chunkAudioPlayer.dataset.path = path;
    chunkAudioPlayer.src = path;
    chunkAudioPlayer.addEventListener('canplaythrough', playFrom, { once:true });
    chunkAudioPlayer.load();
  }else{
    playFrom();
  }
}

function playChunkRealAudio(info, btnEl){
  if(btnEl) btnEl.textContent = '⏸ 播放中...';
  playRealAudioSegment(chunkAudioPath(info), info.startTime, info.endTime, ()=>{
    if(btnEl) btnEl.textContent = '🎧 播放真人語音';
  });
}

/* 整節真人語音播放：跟playChunkRealAudio邏輯一樣，差別只在按鈕圖示用🎧/🔊切換
   （因為這顆按鈕本來就常駐在每節經文旁邊，不像語塊卡片按鈕有完整文字可以改）。 */
function playVerseRealAudio(info, btnEl){
  if(btnEl) btnEl.textContent = '⏸';
  playRealAudioSegment(chunkAudioPath(info), info.startTime, info.endTime, ()=>{
    if(btnEl) btnEl.textContent = '🎧';
  });
}

/* 所在經文預覽區內的單詞/語塊/朗讀點擊代理（跟quizView/verseList同一套代理邏輯）。
   只掛一次在chunkSheetBody上，避免renderChunkSheet每次重繪都重複綁定。 */
function getVerseTextForChunk(bookCode, lang, chapter, verse){
  const source = BOOK_TEXT_SOURCES[bookCode];
  const chapterObj = source ? source.chapters[chapter] : null;
  const v = chapterObj ? chapterObj.verses[verse] : null;
  return v ? v[lang] : null;
}

  const wordEl = e.target.closest('.word');
  if(wordEl){ openWordSheet(wordEl.dataset.id); return; }
  const chunkEl = e.target.closest('.chunk');
  if(chunkEl){ openChunkSheet(chunkEl.dataset.cid); return; }
  const speakBtn = e.target.closest('button[data-speak-lang]');
  if(speakBtn && speakBtn.dataset.book){
    const lang = speakBtn.dataset.speakLang;
    const bookCode = speakBtn.dataset.book;
    const chapter = parseInt(speakBtn.dataset.chapter);
    const verse = parseInt(speakBtn.dataset.verse);
    const text = getVerseTextForChunk(bookCode, lang, chapter, verse);
    const audioInfo = getVerseAudioInfo(bookCode, lang, chapter, verse);
    if(audioInfo){
      playVerseRealAudio(audioInfo, speakBtn);
    }else if(text){
      speak(text, LANGS[lang].ttsLang);
    }
  }
});

   狀態機：quizCurrent為null代表「清零狀態」（首次開啟、或切換出題語言後都會回到這個狀態），
   此時畫面只顯示提示文字，不顯示題目。按下「出題」永遠是「無論目前處在什麼狀態，
   立刻清空目前輸入、重新隨機抽一題、顯示題目」，不會有殘留的舊答案或舊輸入。
   按「答案」時：(a) 把使用者目前打的內容跟資料庫正確經文做逐字/逐詞比對（computeDiff），
   直接疊在輸入框原本的位置上，用顏色標示「你打對的部分」「你打錯/多打的部分（刪除線）」
   「你漏打的部分（自動補上，底色標示）」；(b) 同時在下方保留完整的正確經文，
   沿用既有的語塊高亮/單詞查詢/真人語音點讀功能，供學習查閱。 */
function buildQuizPool(){
  const pool = [];
  BOOK_ORDER.forEach(bookCode=>{
    const source = BOOK_TEXT_SOURCES[bookCode];
    if(!source) return;
    Object.keys(source.chapters).forEach(chNum=>{
      const chapterObj = source.chapters[chNum];
      Object.keys(chapterObj.verses).forEach(vNum=>{
        const v = chapterObj.verses[vNum];
        if(v.en && v.zh && v.ja){
          pool.push({ book:bookCode, chapter:parseInt(chNum), verse:parseInt(vNum), en:v.en, zh:v.zh, ja:v.ja });
        }
      });
    });
  });
  return pool;
}
const QUIZ_POOL = buildQuizPool();
if(QUIZ_POOL.length === 0){
  console.warn('QUIZ_POOL為空——三語配對測驗題庫沒有任何一節三語文字齊全，請確認BOOK_TEXT_SOURCES資料是否正確載入。');
}
/* 保底範例（若資料庫因故載入失敗導致QUIZ_POOL為空，仍用這節固定經文示範，不留白） */

                 ja:'緑色＝抜け（自動補完）　　取り消し線＝誤り・余分な部分' },
};
function qt(dict){ return dict[defaultLang] || dict.zh; }

/* 產生單語一節的可互動HTML（語塊高亮+單詞查詢+真人語音/TTS朗讀按鈕），跟renderVerses()同一套邏輯 */
function quizVerseLineHtml(bookCode, lang, chapter, verseNum, text){
  const hasAudio = getVerseAudioInfo(bookCode, lang, chapter, verseNum);
  const icon = hasAudio ? '🎧' : '🔊';
  return `${highlightText(highlightChunks(text, lang, bookCode), lang)}<button class="inline-btn speak" data-speak-lang="${lang}" data-book="${bookCode}" data-chapter="${chapter}" data-verse="${verseNum}" aria-label="朗讀">${icon}</button>`;
}

/* ---- 逐字/逐詞比對：英文用單詞切詞，中/日用單字切詞（無空格語言的合理折衷） ---- */
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function diffTokenize(text, lang){
  if(!text) return [];
  if(lang === 'en') return text.match(/[A-Za-z']+|[^A-Za-z']+/g) || [];
  return Array.from(text);
}
/* 標準LCS回溯法：same＝雙方相同；del＝使用者多打/打錯（只出現在使用者輸入）；
   ins＝使用者漏打（只出現在正確答案，視為「自動增補」） */
function computeDiff(userTokens, correctTokens){
  const n = userTokens.length, m = correctTokens.length;
  const dp = Array.from({length:n+1}, ()=> new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--){
    for(let j=m-1;j>=0;j--){
      dp[i][j] = userTokens[i]===correctTokens[j] ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j], dp[i][j+1]);
    }
  }
  const ops = [];
  let i=0,j=0;
  while(i<n && j<m){
    if(userTokens[i]===correctTokens[j]){ ops.push({type:'same',text:userTokens[i]}); i++; j++; }
    else if(dp[i+1][j] >= dp[i][j+1]){ ops.push({type:'del',text:userTokens[i]}); i++; }
    else{ ops.push({type:'ins',text:correctTokens[j]}); j++; }
  }
  while(i<n){ ops.push({type:'del',text:userTokens[i]}); i++; }
  while(j<m){ ops.push({type:'ins',text:correctTokens[j]}); j++; }
  return ops;
}
function diffHtml(userText, correctText, lang){
  const ops = computeDiff(diffTokenize(userText, lang), diffTokenize(correctText, lang));
  if(!userText) return `<span class="diff-ins">${escapeHtml(correctText)}</span>`;
  return ops.map(op=>{
    const esc = escapeHtml(op.text);
    if(op.type==='same') return esc;
    if(op.type==='del') return `<span class="diff-del">${esc}</span>`;
    return `<span class="diff-ins">${esc}</span>`;
  }).join('');
}

/* ---- 渲染 ---- */
function renderQuizView(){
  const el = document.getElementById('quizView');
  const langOptions = ['random','zh','en','ja'];
  el.innerHTML = `
    <div class="quiz-topbar" id="quizTopbar">
      <span class="quiz-topbar-title">${qt(QUIZ_UI.title)}</span>
      <div class="quiz-lang-group">
        <label class="quiz-lang-group-label" for="quizLangSelect">${qt(QUIZ_UI.langSettingLbl)}</label>
        <select id="quizLangSelect" class="quiz-lang-select">
          ${langOptions.map(v=>`<option value="${v}" ${quizLangSetting===v?'selected':''}>${v==='random'?qt(QUIZ_UI.langRandom):QUIZ_LANG_LABEL[v][defaultLang]}</option>`).join('')}
        </select>
      </div>
      <button id="quizGenBtn" class="quiz-topbar-btn">${qt(QUIZ_UI.genBtn)}</button>
      <button id="quizRevealBtn" class="quiz-topbar-btn secondary" ${(!quizCurrent || quizRevealed)?'disabled':''}>${qt(QUIZ_UI.reveal)}</button>
    </div>
    <div id="quizBody">${renderQuizBodyHtml()}</div>
  `;

  document.getElementById('quizLangSelect').addEventListener('change', e=>{
    quizLangSetting = e.target.value;
    localStorage.setItem('bible_quizLang', quizLangSetting);
    generateQuizQuestion(); // 用範例取代清零：切換出題語言後直接示範一題，不留白
  });
  document.getElementById('quizGenBtn').addEventListener('click', generateQuizQuestion);
  document.getElementById('quizRevealBtn').addEventListener('click', revealQuizAnswer);

  if(quizCurrent && !quizRevealed){
    ['zh','en','ja'].filter(l=>l!==quizCurrent.promptLang).forEach(l=>{
      const ta = document.querySelector(`textarea[data-lang-input="${l}"]`);
      if(ta){
        ta.value = quizUserInput[l] || '';
        ta.addEventListener('input', e=>{ quizUserInput[l] = e.target.value; });
      }
    });
  }
}

function renderQuizBodyHtml(){
  if(!quizCurrent){
    return `<div class="verse" style="text-align:center;color:var(--text-soft);">${qt(QUIZ_UI.emptyState)}</div>`;
  }
  const { entry, promptLang } = quizCurrent;
  const otherLangs = ['zh','en','ja'].filter(l=>l!==promptLang);
  const bookLabel = BOOKS[entry.book] ? BOOKS[entry.book][defaultLang] : entry.book;

  return `
    <div class="verse">
      <div class="lbl">${qt(QUIZ_UI.promptLbl)}（${QUIZ_LANG_LABEL[promptLang][defaultLang]} · ${bookLabel} ${entry.chapter}:${entry.verse}）</div>
      <span class="primary-text" data-lang="${promptLang}">${quizVerseLineHtml(entry.book, promptLang, entry.chapter, entry.verse, entry[promptLang])}</span>
    </div>
    ${otherLangs.map(l=>`
      <div class="verse-extra" data-lang-block="${l}" style="display:block;">
        <div class="lbl">${qt(QUIZ_UI.yourAnswer)}（${QUIZ_LANG_LABEL[l][defaultLang]}）</div>
        ${quizRevealed
          ? `<div class="quiz-diff-box">${diffHtml(quizUserInput[l]||'', entry[l], l)}</div>`
          : `<textarea class="quiz-answer-input" data-lang-input="${l}" rows="2" placeholder="${qt(QUIZ_UI.placeholder)}"></textarea>`
        }
        ${quizRevealed ? `
        <div class="quiz-reveal-box" data-reveal-lang="${l}" style="margin-top:8px;">
          <div class="lbl">${qt(QUIZ_UI.answerLbl)}</div>
          <span class="extra-text" data-lang="${l}">${quizVerseLineHtml(entry.book, l, entry.chapter, entry.verse, entry[l])}</span>
        </div>` : ''}
      </div>
    `).join('')}
    ${quizRevealed ? `<div class="quiz-diff-legend">${qt(QUIZ_UI.diffLegend)}</div>` : ''}
  `;
}

function generateQuizQuestion(){
  // 無論目前處在什麼狀況，一點「出題」即清零重來；若題庫真的異常為空，改用固定保底範例（詩23:1），不留白
  const entry = QUIZ_POOL.length
    ? QUIZ_POOL[Math.floor(Math.random()*QUIZ_POOL.length)]
    : QUIZ_FALLBACK_ENTRY;
  quizCurrent = { entry, promptLang: pickQuizPromptLang() };
  quizRevealed = false;
  quizUserInput = { zh:'', en:'', ja:'' };
  renderQuizView();
}

function revealQuizAnswer(){
  if(!quizCurrent || quizRevealed) return;
  // 重新渲染前，先把目前輸入框裡使用者實際打的內容存起來，避免渲染後遺失
  ['zh','en','ja'].forEach(l=>{
    const ta = document.querySelector(`textarea[data-lang-input="${l}"]`);
    if(ta) quizUserInput[l] = ta.value;
  });
  quizRevealed = true;
  renderQuizView();
}

/* 事件代理：quizView內的單詞/語塊點擊、朗讀按鈕，複用既有彈窗與播放邏輯（跟#verseList的代理邏輯對應） */
document.getElementById('quizView').addEventListener('click', e=>{
  const wordEl = e.target.closest('.word');
  if(wordEl){ openWordSheet(wordEl.dataset.id); return; }
  const chunkEl = e.target.closest('.chunk');
  if(chunkEl){ openChunkSheet(chunkEl.dataset.cid); return; }
  const speakBtn = e.target.closest('button[data-speak-lang]');
  if(speakBtn && quizCurrent){
    const lang = speakBtn.dataset.speakLang;
    const bookCode = speakBtn.dataset.book;
    const chapter = parseInt(speakBtn.dataset.chapter);
    const verse = parseInt(speakBtn.dataset.verse);
    const text = quizCurrent.entry[lang];
    const audioInfo = getVerseAudioInfo(bookCode, lang, chapter, verse);
    if(audioInfo){
      playVerseRealAudio(audioInfo, speakBtn);
    }else{
      speak(text, LANGS[lang].ttsLang);
    }
  }
});

/* ============ 模式切換：閱讀 / 經文互譯 / 經文填空 / 語塊 ============ */
function switchAppMode(mode){
  document.getElementById('verseList').style.display     = mode === 'read'      ? '' : 'none';
  document.getElementById('quizView').style.display      = mode === 'translate' ? '' : 'none';
  document.getElementById('fillQuizView').style.display  = mode === 'fill'      ? '' : 'none';
  document.getElementById('chunkListView').style.display = mode === 'chunks'    ? '' : 'none';
  localStorage.setItem('bible_appMode', mode);
  if(mode === 'translate'){ if(!quizCurrent) generateQuizQuestion(); else renderQuizView(); } // 經文互譯：首次進入自動示範一題，不留白；已有題目則維持現狀
  if(mode === 'fill') renderFillQuizView();       // 經文填空：沿用原本「一進來就自動出題」的體驗
  if(mode === 'chunks') renderChunkListView();    // 語塊：按書卷分組列表
}
setupSeg('appModeSeg', switchAppMode);
(function restoreAppMode(){
  const saved = localStorage.getItem('bible_appMode') || 'read';
  document.querySelectorAll('#appModeSeg button').forEach(b=>b.classList.toggle('active', b.dataset.val === saved));
  switchAppMode(saved);
})();

/* ============ 語塊總覽（新功能）：按書卷分組瀏覽所有已標注語塊 ============
   只按書卷分組（不細分到章），同一列合併顯示英/日語塊，用跟閱讀模式一致的
   --en-color/--ja-color在每列左側標色區分語言（目前尚無中文語塊）。
   點擊任一列，開啟既有的語塊詳情彈窗（openChunkSheet），裡面已包含讀音/附注/
   加入語塊本功能，另外新增了「所在經文」（見renderChunkSheet的修改）。 */
function buildChunkListByBook(){
  const map = {};
  BOOK_ORDER.forEach(bookCode=>{
    const list = CHUNKS.filter(c=>c.book===bookCode).slice().sort((a,b)=>
      (a.chapter-b.chapter) || (a.verse-b.verse) || (a.lang<b.lang?-1:1)
    );
    if(list.length) map[bookCode] = list;
  });
  return map;
}
const CHUNK_LIST_BY_BOOK = buildChunkListByBook();
let chunkListExpanded = {};

const CHUNK_LIST_UI = {
  title: { zh:'語塊總覽（按書卷分組）', en:'Chunk Library (by book)', ja:'チャンク一覧（書巻別）' },
};

function renderChunkListView(){
  const el = document.getElementById('chunkListView');
  el.innerHTML = `
    <div class="verse" style="text-align:center;font-weight:700;">${qt(CHUNK_LIST_UI.title)}</div>
    ${Object.keys(CHUNK_LIST_BY_BOOK).map(bookCode=>{
      const list = CHUNK_LIST_BY_BOOK[bookCode];
      const open = !!chunkListExpanded[bookCode];
      const bookLabel = BOOKS[bookCode] ? BOOKS[bookCode][defaultLang] : bookCode;
      return `
        <div class="chunk-book-group">
          <button class="chunk-book-header" data-book="${bookCode}">
            <span>${bookLabel}</span>
            <span class="chunk-book-count">${list.length}</span>
            <span class="chunk-book-arrow">${open ? '▾' : '▸'}</span>
          </button>
          ${open ? `
          <div class="chunk-book-list">
            ${list.map(c=>`
              <div class="chunk-row" data-cid="${c.id}" style="border-left-color:var(${c.lang==='en'?'--en-color':'--ja-color'});">
                <span class="chunk-row-text">${escapeHtml(c.text)}</span>
                <span class="chunk-row-ref">${c.chapter}:${c.verse}</span>
              </div>
            `).join('')}
          </div>` : ''}
        </div>
      `;
    }).join('')}
  `;
  el.querySelectorAll('.chunk-book-header').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const book = btn.dataset.book;
      chunkListExpanded[book] = !chunkListExpanded[book];
      renderChunkListView();
    });
  });
}
document.getElementById('chunkListView').addEventListener('click', e=>{
  const row = e.target.closest('.chunk-row');
  if(row) openChunkSheet(row.dataset.cid);
});

/* ============ Phase 4：情境復現填空測驗（現在是主內容區的「經文填空」模式，
   不再是彈出式sheet；沿用原本「一進來就自動出題」的體驗） ============ */
let quizCurrentId = null;

function pickQuizChunk(){
  const internalized = getInternalized();
  const notDone = CHUNKS.filter(c => !internalized.includes(c.id));
  const pool = notDone.length ? notDone : CHUNKS;
  return pool[Math.floor(Math.random() * pool.length)];
}

function renderFillQuizView(){
  if(!quizCurrentId) quizCurrentId = pickQuizChunk().id;
  const c = CHUNKS_BY_ID[quizCurrentId];
  const internalized = getInternalized().includes(c.id);
  const el = document.getElementById('fillQuizView');
  el.innerHTML = `
    <div class="quiz-prompt-lbl">你還記得這個顆粒嗎？</div>
    <div class="quiz-blank">${c.blank}</div>
    <input class="quiz-input" id="quizInput" placeholder="輸入缺少的單詞" autocomplete="off">
    <div class="quiz-btn-row">
      <button class="quiz-check-btn" id="quizCheckBtn">檢查答案</button>
      <button class="quiz-next-btn" id="quizNextBtn">下一題</button>
    </div>
    <div class="quiz-feedback" id="quizFeedback"></div>
    <div class="quiz-reveal" id="quizReveal">
      <b>${c.text}</b><br>
      出處：${c.ref}<br>
      附注：${c.gloss}<br>
      現代用法：${c.usage}
    </div>
    <button class="quiz-mark-btn ${internalized?'on':''}" id="quizMarkBtn">
      ${internalized ? '✓ 已標記為已內化' : '標記為已內化'}
    </button>
  `;
  const input = document.getElementById('quizInput');
  const feedback = document.getElementById('quizFeedback');
  const reveal = document.getElementById('quizReveal');

  function checkAnswer(){
    const val = input.value.trim().toLowerCase();
    const correct = val === c.answer.toLowerCase();
    feedback.textContent = correct ? '✓ 答對了！' : `✗ 再想想。正確答案：${c.answer}`;
    feedback.className = 'quiz-feedback show ' + (correct ? 'correct' : 'wrong');
    reveal.classList.add('show');
    if(correct) markInternalized(c.id, true);
    renderMarkBtnState();
  }
  function renderMarkBtnState(){
    const on = getInternalized().includes(c.id);
    const btn = document.getElementById('quizMarkBtn');
    btn.classList.toggle('on', on);
    btn.textContent = on ? '✓ 已標記為已內化' : '標記為已內化';
  }

  document.getElementById('quizCheckBtn').addEventListener('click', checkAnswer);
  input.addEventListener('keydown', e=>{ if(e.key === 'Enter') checkAnswer(); });
  document.getElementById('quizNextBtn').addEventListener('click', ()=>{
    quizCurrentId = pickQuizChunk().id;
    renderFillQuizView();
  });
  document.getElementById('quizMarkBtn').addEventListener('click', ()=>{
    const on = !getInternalized().includes(c.id);
    markInternalized(c.id, on);
    renderMarkBtnState();
  });
}

window.addEventListener('scroll', ()=>{
  localStorage.setItem('bible_scrollY', window.scrollY);
});
window.addEventListener('load', ()=>{
  const y = localStorage.getItem('bible_scrollY');
  if(y) window.scrollTo(0, parseInt(y));
});
